<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 780 380" width="780" height="380" style="background:#ffffff">
<defs><marker id="ah" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333333"/></marker><marker id="ah-light" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#999999"/></marker></defs>

<rect x="35" y="55" width="340" height="200" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
<text x="47" y="73" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="bold" textLength="148.44" lengthAdjust="spacingAndGlyphs">Один раунд (Single-turn)</text>
<text x="205" y="95" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">GeneralPoints / AdaptThink</text>
<text x="50" y="112" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="167.92" lengthAdjust="spacingAndGlyphs">Промпт: "получи 24 из [7,J,3,5]"</text>
<text x="50" y="137" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="190.97" lengthAdjust="spacingAndGlyphs">→ LLM сразу генерирует рассуждение + ответ</text>
<text x="50" y="162" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="158.78" lengthAdjust="spacingAndGlyphs">→ Проверка ответа → R ∈ {0, 1}</text>
<text x="50" y="187" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="73.89" lengthAdjust="spacingAndGlyphs">→ Обновление политики</text>
<text x="205" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="234.89" lengthAdjust="spacingAndGlyphs">Без состояния · мгновенное вознаграждение · простое распределение заслуг</text>
<rect x="405" y="55" width="340" height="200" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
<text x="417" y="73" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="bold" textLength="137.75" lengthAdjust="spacingAndGlyphs">Несколько раундов (Multi-turn)</text>
<text x="575" y="95" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="182.53" lengthAdjust="spacingAndGlyphs">Навигация V-IRL / инструменты AWorld</text>
<text x="420" y="112" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="177.36" lengthAdjust="spacingAndGlyphs">Шаг 1: обзор улицы → решить повернуть налево</text>
<text x="420" y="137" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="177.36" lengthAdjust="spacingAndGlyphs">Шаг 2: распознать ориентир → скорректировать направление</text>
<text x="420" y="162" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="152.29" lengthAdjust="spacingAndGlyphs">Шаг 3: неверный поворот → R=-1</text>
<text x="420" y="187" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="179.15" lengthAdjust="spacingAndGlyphs">...  Шаг 20: цель достигнута → R=+1</text>
<text x="575" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="234.89" lengthAdjust="spacingAndGlyphs">Состояние между шагами · задержанное вознаграждение · сложное распределение заслуг</text>
<text x="390" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="57.00" lengthAdjust="spacingAndGlyphs">Распределение заслуг</text>
<text x="205" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="140.00" lengthAdjust="spacingAndGlyphs">Мгновенная обратная связь, оценка каждого шага</text>
<text x="575" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="196.00" lengthAdjust="spacingAndGlyphs">Задержанная связь: нужно понять, какой шаг внёс наибольший вклад</text>
<text x="390" y="307" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="56.00" lengthAdjust="spacingAndGlyphs">Управление состоянием</text>
<text x="205" y="307" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="70.00" lengthAdjust="spacingAndGlyphs">Нет скрытого состояния</text>
<text x="575" y="307" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="154.00" lengthAdjust="spacingAndGlyphs">Частичная наблюдаемость, нужна история</text>
<text x="390" y="339" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="57.00" lengthAdjust="spacingAndGlyphs">Проектирование вознаграждения</text>
<text x="205" y="339" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="131.47" lengthAdjust="spacingAndGlyphs">Достаточно вознаграждения за результат (0/1)</text>
<text x="575" y="339" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="161.78" lengthAdjust="spacingAndGlyphs">Баланс процессного и итогового вознаграждения</text>
<text x="390" y="371" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="56.00" lengthAdjust="spacingAndGlyphs">Стоимость исследования</text>
<text x="205" y="371" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="56.00" lengthAdjust="spacingAndGlyphs">Одна генерация</text>
<text x="575" y="371" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="137.70" lengthAdjust="spacingAndGlyphs">Вся траектория (10–50 шагов)</text>
</svg>