<path d="M 468,150 Q 469.1695571333223,216.2033393123934 432,271" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="440" y="192" width="40" height="24" rx="3" fill="white"/>
<text x="459.58477856666116" y="203.3516696561967" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="32.00" lengthAdjust="spacingAndGlyphs">Результат</text>
<rect x="470" y="220" width="280" height="260" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="610" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="127.80" lengthAdjust="spacingAndGlyphs">Цикл обучения PPO</text>
<text x="480" y="265" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold" textLength="152.48" lengthAdjust="spacingAndGlyphs">Базовая модель: Qwen2.5-32B</text>
<text x="480" y="283" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="127.72" lengthAdjust="spacingAndGlyphs">Холодный старт SFT: ~1 час</text>
<text x="480" y="301" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="143.83" lengthAdjust="spacingAndGlyphs">Обучение с подкреплением: ~9 дней / 400 шагов</text>
<text x="480" y="337" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="164.41" lengthAdjust="spacingAndGlyphs">На шаг: 32 задачи × 16 кандидатов = 512</text>
<text x="480" y="355" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="129.91" lengthAdjust="spacingAndGlyphs">В среднем 7–9 раундов взаимодействия/ответ</text>
<text x="480" y="391" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold" textLength="120.59" lengthAdjust="spacingAndGlyphs">Точность AIME 2024:</text>
<text x="480" y="409" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="93.89" lengthAdjust="spacingAndGlyphs">  База SFT: 25%</text>
<text x="480" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="90.02" lengthAdjust="spacingAndGlyphs">  После 110 шагов: 52%</text>
<text x="480" y="445" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="91.06" lengthAdjust="spacingAndGlyphs">  После 400 шагов: 67%</text>
