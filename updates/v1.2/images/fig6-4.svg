<text x="45" y="159" font-family="'Courier New', Courier, monospace" font-size="12" fill="#333333" text-anchor="start" dominant-baseline="central" textLength="106.41" lengthAdjust="spacingAndGlyphs">Выявление галлюцинаций: Veto ⚠</text>
<text x="45" y="181" font-family="'Courier New', Courier, monospace" font-size="12" fill="#333333" text-anchor="start" dominant-baseline="central" textLength="115.22" lengthAdjust="spacingAndGlyphs">Полнота: Important</text>
