<text x="440" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#cccccc" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="168.00" lengthAdjust="spacingAndGlyphs">Разнородные Judge-модели снижают предвзятость одного источника</text>
