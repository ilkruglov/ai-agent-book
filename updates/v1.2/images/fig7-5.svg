<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 780 440" width="780" height="440" style="background:#ffffff">
<defs><marker id="ah" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333333"/></marker><marker id="ah-light" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#999999"/></marker></defs>

<rect x="30" y="60" width="320" height="45" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
<text x="200.0" y="82.5" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="133.67" lengthAdjust="spacingAndGlyphs">Классический RL-агент</text>
<rect x="430" y="60" width="320" height="45" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
<text x="590" y="82.5" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">LLM Agent</text>
<rect x="30" y="115" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<rect x="430" y="115" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="38" y="137" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="197.12" lengthAdjust="spacingAndGlyphs">Замкнутое, конечное: {восток,запад,юг,север,взять,атаковать}</text>
<text x="438" y="137" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="197.97" lengthAdjust="spacingAndGlyphs">Открытое, бесконечное: естественный язык + вызовы инструментов</text>
<text x="390" y="137" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="56.00" lengthAdjust="spacingAndGlyphs">Пространство действий</text>
<rect x="30" y="163" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<rect x="430" y="163" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="38" y="185" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="154.00" lengthAdjust="spacingAndGlyphs">Без априорных знаний, старт со случайной политики</text>
<text x="438" y="185" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="197.97" lengthAdjust="spacingAndGlyphs">Обширные знания из предобучения + правила языковой игры</text>
<text x="390" y="185" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="57.00" lengthAdjust="spacingAndGlyphs">Априорные знания</text>
<rect x="30" y="211" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<rect x="430" y="211" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="38" y="233" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">Хеш-код: state_id=0x3A7F</text>
<text x="438" y="233" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="191.97" lengthAdjust="spacingAndGlyphs">Семантическое понимание: "в кладовой есть красный ключ"</text>
<text x="390" y="233" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="56.00" lengthAdjust="spacingAndGlyphs">Представление состояния</text>
<rect x="30" y="259" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<rect x="430" y="259" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="38" y="281" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="193.04" lengthAdjust="spacingAndGlyphs">Скалярное вознаграждение: R ∈ {-1, 0, +5, +50}</text>
<text x="438" y="281" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="171.92" lengthAdjust="spacingAndGlyphs">Вознаграждение + языковая обратная связь + саморефлексия</text>
<text x="390" y="281" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="56.00" lengthAdjust="spacingAndGlyphs">Обучающий сигнал</text>
<rect x="30" y="307" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<rect x="430" y="307" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="38" y="329" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="154.00" lengthAdjust="spacingAndGlyphs">Без внутренних рассуждений (чисто реактивный)</text>
<text x="438" y="329" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="166.45" lengthAdjust="spacingAndGlyphs">Рассуждение как особое действие (CoT)</text>
<text x="390" y="329" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="56.00" lengthAdjust="spacingAndGlyphs">Способность рассуждать</text>
<rect x="30" y="355" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<rect x="430" y="355" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="38" y="377" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="154.00" lengthAdjust="spacingAndGlyphs">Одна среда; при смене правил нужно переобучение</text>
<text x="438" y="377" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="157.89" lengthAdjust="spacingAndGlyphs">Zero-shot/few-shot перенос между задачами</text>
<text x="390" y="377" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="56.00" lengthAdjust="spacingAndGlyphs">Обобщение</text>
<rect x="30" y="403" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<rect x="430" y="403" width="320" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="38" y="425" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="152.17" lengthAdjust="spacingAndGlyphs">~10 000 эпизодов / 10 с</text>
<text x="438" y="425" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">~1 эпизод / 2 мин</text>
<text x="390" y="425" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="56.00" lengthAdjust="spacingAndGlyphs">Эффективность выборки</text>
