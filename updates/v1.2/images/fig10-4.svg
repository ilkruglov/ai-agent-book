<rect x="460" y="107" width="280" height="38" rx="3" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="468" y="120" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">① Рендеринг Slidev → PDF/PNG</text>
<text x="468" y="135" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="266.0" lengthAdjust="spacingAndGlyphs">② Многоаспектная оценка Vision LLM</text>
<rect x="460" y="151" width="280" height="75" rx="3" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="468" y="165" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold" textLength="266.0" lengthAdjust="spacingAndGlyphs">Структурированная обратная связь:</text>
<text x="468" y="183" font-family="'Courier New', Courier, monospace" font-size="11" fill="#333333" text-anchor="start" dominant-baseline="central">Стр. Тип проблемы   Критичность</text>
<text x="468" y="198" font-family="'Courier New', Courier, monospace" font-size="11" fill="#333333" text-anchor="start" dominant-baseline="central">P3   Слишком плотно высокая</text>
<text x="468" y="213" font-family="'Courier New', Courier, monospace" font-size="11" fill="#333333" text-anchor="start" dominant-baseline="central">P7   Мелкий шрифт    средняя</text>
<text x="468" y="228" font-family="'Courier New', Courier, monospace" font-size="11" fill="#333333" text-anchor="start" dominant-baseline="central">P11  Плохие цвета    низкая</text>
<text x="600" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="288.0" lengthAdjust="spacingAndGlyphs">Рендеринг + визуальный анализ → конкретные правки</text>
<line x1="332" y1="135" x2="448" y2="135" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="390.0" y="123" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Код Slidev</text>
<line x1="448" y1="215" x2="332" y2="215" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="390.0" y="231" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Отзыв</text>
<rect x="30" y="290" width="720" height="100" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="390" y="308" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Итеративная доработка</text>
<rect x="75" y="325" width="190" height="52" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="170.0" y="337.2" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Раунд 1</text>
<text x="170.0" y="351.0" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.0" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold">Черновик, 12 страниц</text>
<text x="170.0" y="364.8" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.0" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold">5 проблем</text>
<line x1="269" y1="351" x2="291" y2="351" stroke="#999999" stroke-width="2" marker-end="url(#ah-light)"/>
<rect x="295" y="325" width="190" height="52" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
