<text x="390.0" y="345.82500000000005" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.0" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold">14 страниц (перегруженные страницы</text>
<text x="390.0" y="356.175" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.0" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold">разделены)</text>
<text x="390.0" y="366.52500000000003" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.0" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold">2 проблемы</text>
<line x1="489" y1="351" x2="511" y2="351" stroke="#999999" stroke-width="2" marker-end="url(#ah-light)"/>
<rect x="515" y="325" width="190" height="52" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
<text x="610.0" y="337.2" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Раунд 3</text>
<text x="610.0" y="351.0" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.0" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold">14 страниц (шрифт исправлен)</text>
<text x="610.0" y="364.8" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.0" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold">0 проблем ✓</text>
<rect x="30" y="405" width="720" height="90" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="390" y="425" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Почему не один AI-агент?</text>
<text x="60" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="300.0" lengthAdjust="spacingAndGlyphs">Один агент: рендеры ×N раундов → контекст разрастается</text>
<text x="60" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="300.0" lengthAdjust="spacingAndGlyphs">(снимок 1080p = тысячи токенов × 14 страниц × 5 раундов)</text>
<text x="410" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="320.0" lengthAdjust="spacingAndGlyphs">Два агента: рецензент видит текущую версию</text>
<text x="410" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="320.0" lengthAdjust="spacingAndGlyphs">Редактор копит только отзывы → чистый контекст</text>
</svg>