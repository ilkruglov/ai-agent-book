<rect x="30" y="55" width="720" height="28" rx="3" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="390" y="69" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">▼ Единый контекст — история диалога сохраняется между этапами ▼</text>
