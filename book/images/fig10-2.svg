<text x="146" y="142" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="212.0" lengthAdjust="spacingAndGlyphs">Аналитик требований</text>
<rect x="42" y="160" width="209" height="88" rx="3" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="48" y="175" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal">Системный промпт</text>
<text x="48" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="197.0" lengthAdjust="spacingAndGlyphs">&quot;Ваша задача — понять требования.</text>
<text x="48" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="197.0" lengthAdjust="spacingAndGlyphs">Не переходите к реализации: сейчас</text>
<text x="48" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="197.0" lengthAdjust="spacingAndGlyphs">нужно задавать вопросы и уточнять.&quot;</text>
<rect x="42" y="258" width="209" height="78" rx="3" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="48" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal">Набор инструментов</text>
<text x="48" y="290" font-family="'Courier New', Courier, monospace" font-size="11" fill="#333333" text-anchor="start" dominant-baseline="central">ask_clarifying_question(q)</text>
<text x="48" y="310" font-family="'Courier New', Courier, monospace" font-size="11" fill="#333333" text-anchor="start" dominant-baseline="central">save_requirement(k, v)</text>
