<text x="632" y="142" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Рецензент кода</text>
<rect x="528" y="160" width="209" height="88" rx="3" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
