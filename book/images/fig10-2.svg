<text x="389" y="142" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Разработчик</text>
<rect x="285" y="160" width="209" height="88" rx="3" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="291" y="175" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal">Системный промпт</text>
<text x="291" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="197.0" lengthAdjust="spacingAndGlyphs">&quot;Напишите качественный Python-код</text>
<text x="291" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="197.0" lengthAdjust="spacingAndGlyphs">по согласованным требованиям.</text>
<text x="291" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="197.0" lengthAdjust="spacingAndGlyphs">Следуйте лучшим практикам модульности и обработки ошибок.&quot;</text>
