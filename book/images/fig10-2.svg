<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 940" width="780" height="940" style="background:#fff">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#555"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#222">
<rect x="20" y="20" width="155" height="100" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="97.5" y="50" font-size="20" font-weight="bold" text-anchor="middle">Агенты</text>
<text x="38" y="82" font-size="17" text-anchor="start">Agent A / B</text>
<rect x="205" y="20" width="370" height="120" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="50" font-size="20" font-weight="bold" text-anchor="middle">Виртуальная файловая система</text>
<text x="223" y="82" font-size="17" text-anchor="start">Единый интерфейс: read_file,</text>
<text x="223" y="108" font-size="17" text-anchor="start">write_file, list_dir</text>
<rect x="600" y="20" width="160" height="100" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="680" y="50" font-size="20" font-weight="bold" text-anchor="middle">Пользователь</text>
<text x="618" y="82" font-size="16" text-anchor="start">Загрузка и</text>
<text x="618" y="108" font-size="16" text-anchor="start">скачивание</text>
<path d="M175 75 L202 75" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M680 122 L680 208" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390" y="176" font-size="18" font-weight="bold" text-anchor="middle">Четыре области: права и жизненный цикл задаёт среда</text>
<rect x="20" y="210" width="355" height="270" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="197.5" y="240" font-size="20" font-weight="bold" text-anchor="middle">Личная рабочая область</text>
<text x="38" y="272" font-size="17" text-anchor="start">Scratchpad: /scratch/&lt;id&gt;</text>
<text x="38" y="298" font-size="17" text-anchor="start">Черновики отдельного агента.</text>
<text x="38" y="324" font-size="17" text-anchor="start">Чтение и запись владельцем.</text>
<text x="38" y="350" font-size="17" text-anchor="start">Жизненный цикл связан</text>
<text x="38" y="376" font-size="17" text-anchor="start">с экземпляром агента.</text>
<text x="38" y="402" font-size="17" text-anchor="start">Приватность обеспечивается</text>
<text x="38" y="428" font-size="17" text-anchor="start">правами доступа.</text>
<rect x="405" y="210" width="355" height="270" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="582.5" y="240" font-size="20" font-weight="bold" text-anchor="middle">Общее рабочее пространство</text>
<text x="423" y="272" font-size="17" text-anchor="start">Shared Workspace</text>
<text x="423" y="298" font-size="17" text-anchor="start">/workspace/shared</text>
<text x="423" y="324" font-size="17" text-anchor="start">Результаты задачи и обмен файлами.</text>
<text x="423" y="350" font-size="17" text-anchor="start">Доступ пользователя по политике.</text>
<text x="423" y="376" font-size="17" text-anchor="start">Конкурентные записи требуют</text>
<text x="423" y="402" font-size="17" text-anchor="start">атомарного контроля версий</text>
<text x="423" y="428" font-size="17" text-anchor="start">или отдельных worktree.</text>
<rect x="20" y="525" width="355" height="295" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="197.5" y="555" font-size="20" font-weight="bold" text-anchor="middle">Внешние ресурсы</text>
<text x="38" y="587" font-size="17" text-anchor="start">/mnt/gdrive, /mnt/notion</text>
<text x="38" y="613" font-size="17" text-anchor="start">Доступ через адаптеры.</text>
<text x="38" y="639" font-size="17" text-anchor="start">Права задаёт внешний сервис.</text>
<text x="38" y="665" font-size="17" text-anchor="start">Чтение и запись зависят</text>
<text x="38" y="691" font-size="17" text-anchor="start">от авторизации и API.</text>
<text x="38" y="717" font-size="17" text-anchor="start">Задержки и согласованность</text>
<text x="38" y="743" font-size="17" text-anchor="start">зависят от сервиса и адаптера.</text>
<text x="38" y="769" font-size="17" text-anchor="start">Источники: Google Drive, Notion.</text>
<rect x="405" y="525" width="355" height="295" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="582.5" y="555" font-size="20" font-weight="bold" text-anchor="middle">Системные ресурсы</text>
<text x="423" y="587" font-size="17" text-anchor="start">/skills</text>
<text x="423" y="613" font-size="17" text-anchor="start">Skills, шаблоны и руководства.</text>
<text x="423" y="639" font-size="17" text-anchor="start">В данной архитектуре —</text>
<text x="423" y="665" font-size="17" text-anchor="start">общие ресурсы только для чтения.</text>
<text x="423" y="691" font-size="17" text-anchor="start">Сохраняются между сеансами.</text>
<text x="423" y="717" font-size="17" text-anchor="start">Загружаются по мере надобности.</text>
<text x="390" y="860" font-size="17" text-anchor="middle">Монтирование объединяет интерфейс, а не модели согласованности.</text>
<text x="390" y="890" font-size="17" text-anchor="middle">Путь полезен получателю только при общей видимости и доступе.</text>
</g>
</svg>
