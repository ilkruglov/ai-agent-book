<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1080" width="780" height="1080" style="background:#fff">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#555"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#222">
<rect x="130" y="20" width="520" height="122" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="50" font-size="20" font-weight="bold" text-anchor="middle">Ведущий — управление кодом</text>
<text x="148" y="82" font-size="18" text-anchor="start">Состояние игры, этапы и выдача информации.</text>
<text x="148" y="108" font-size="18" text-anchor="start">Ночь → день → голосование → итоги.</text>
<text x="390" y="182" font-size="22" font-weight="bold" text-anchor="middle">Пример ролей и доступной информации</text>
<rect x="20" y="210" width="355" height="190" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="197.5" y="240" font-size="20" font-weight="bold" text-anchor="middle">Оборотни 1 и 2</text>
<text x="38" y="272" font-size="17" text-anchor="start">Видят союзников и ночной чат.</text>
<text x="38" y="298" font-size="17" text-anchor="start">Ночью согласуют цель.</text>
<text x="38" y="324" font-size="17" text-anchor="start">Днём могут притворяться мирными</text>
<text x="38" y="350" font-size="17" text-anchor="start">и координировать голоса.</text>
<rect x="405" y="210" width="355" height="190" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="582.5" y="240" font-size="20" font-weight="bold" text-anchor="middle">Провидец</text>
<text x="423" y="272" font-size="17" text-anchor="start">Видит только свои проверки.</text>
<text x="423" y="298" font-size="17" text-anchor="start">Ночью проверяет одного игрока.</text>
<text x="423" y="324" font-size="17" text-anchor="start">Выбирает, когда раскрыться.</text>
<text x="423" y="350" font-size="17" text-anchor="start">Доступны публичные реплики.</text>
<rect x="20" y="430" width="355" height="190" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="197.5" y="460" font-size="20" font-weight="bold" text-anchor="middle">Ведьма</text>
<text x="38" y="492" font-size="17" text-anchor="start">Видит жертву текущей ночи</text>
<text x="38" y="518" font-size="17" text-anchor="start">и состояние своих зелий.</text>
<text x="38" y="544" font-size="17" text-anchor="start">Выбирает спасение или отравление</text>
<text x="38" y="570" font-size="17" text-anchor="start">в рамках правил данной игры.</text>
<rect x="405" y="430" width="355" height="190" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="582.5" y="460" font-size="20" font-weight="bold" text-anchor="middle">Два мирных жителя</text>
<text x="423" y="492" font-size="17" text-anchor="start">Видят публичные высказывания</text>
<text x="423" y="518" font-size="17" text-anchor="start">и историю голосования.</text>
<text x="423" y="544" font-size="17" text-anchor="start">Анализируют речи.</text>
<text x="423" y="570" font-size="17" text-anchor="start">Закрытые данные недоступны.</text>
<text x="390" y="657" font-size="18" font-weight="bold" text-anchor="middle">Ведущий фильтрует контекст и проверяет допустимость действий.</text>
<rect x="20" y="700" width="740" height="310" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="730" font-size="20" font-weight="bold" text-anchor="middle">Голосовое взаимодействие: ASR + LLM + TTS</text>
<text x="38" y="762" font-size="18" text-anchor="start">День: ведущий задаёт порядок выступлений по местам.</text>
<text x="38" y="788" font-size="18" text-anchor="start">Голосование: собирает голоса, считает и объявляет итог.</text>
<text x="38" y="814" font-size="18" text-anchor="start">Ночь: вызывает роли по очереди через закрытые каналы.</text>
<text x="38" y="840" font-size="18" text-anchor="start">Живой игрок получает случайную роль, выступает и голосует.</text>
<text x="38" y="866" font-size="18" text-anchor="start"></text>
<text x="38" y="892" font-size="18" text-anchor="start">Приведённые стратегии — возможное поведение участников,</text>
<text x="38" y="918" font-size="18" text-anchor="start">а не обязательные действия. Точные правила ролей и победы</text>
<text x="38" y="944" font-size="18" text-anchor="start">задаются выбранным вариантом игры.</text>
<text x="390" y="1047" font-size="17" text-anchor="middle">Полномочия обеспечивает код ведущего, а не обещание роли</text>
<text x="390" y="1072" font-size="17" text-anchor="middle">не читать чужие секреты.</text>
</g>
</svg>
