<rect x="185" y="180" width="135" height="140" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
<text x="252" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">🐺 Оборотень 2</text>
