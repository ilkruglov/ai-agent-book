<text x="252" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="122.0" lengthAdjust="spacingAndGlyphs">Стратегия: голосовать вместе</text>
