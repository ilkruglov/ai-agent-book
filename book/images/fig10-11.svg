<text x="50" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold" textLength="50.0" lengthAdjust="spacingAndGlyphs">Ведьма:</text>
<text x="105" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="285.0" lengthAdjust="spacingAndGlyphs">Жертва этой ночи + статус противоядия и яда + публичные высказывания</text>
<text x="400" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold" textLength="50.0" lengthAdjust="spacingAndGlyphs">Мирные:</text>
<text x="455" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="285.0" lengthAdjust="spacingAndGlyphs">Только публичные высказывания + история голосования (без закрытых данных)</text>
