<text x="400" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold" textLength="50.0" lengthAdjust="spacingAndGlyphs">Провидец:</text>
