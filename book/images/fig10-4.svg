<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 800" width="780" height="800" style="background:#fff">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#555"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#222">
<rect x="155" y="20" width="470" height="160" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="50" font-size="20" font-weight="bold" text-anchor="middle">Агент-менеджер</text>
<text x="173" y="82" font-size="18" text-anchor="start">Понимание задачи → декомпозиция.</text>
<text x="173" y="108" font-size="18" text-anchor="start">Диспетчеризация → итоговая сводка.</text>
<text x="173" y="134" font-size="18" text-anchor="start">Инструменты: call_agent_A/B/C,</text>
<text x="173" y="160" font-size="18" text-anchor="start">search, write_file.</text>
<path d="M390 182 L135 227" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="230" width="230" height="180" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="135" y="260" font-size="20" font-weight="bold" text-anchor="middle">Субагент A</text>
<text x="38" y="292" font-size="17" text-anchor="start">Сбор данных.</text>
<text x="38" y="318" font-size="17" text-anchor="start">Поиск документации.</text>
<text x="38" y="344" font-size="17" text-anchor="start">Извлечение фактов.</text>
<path d="M390 182 L390 227" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="275" y="230" width="230" height="180" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="260" font-size="20" font-weight="bold" text-anchor="middle">Субагент B</text>
<text x="293" y="292" font-size="17" text-anchor="start">Анализ.</text>
<text x="293" y="318" font-size="17" text-anchor="start">Сопоставление данных.</text>
<text x="293" y="344" font-size="17" text-anchor="start">Подготовка статистики.</text>
<path d="M390 182 L645 227" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="530" y="230" width="230" height="180" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="645" y="260" font-size="20" font-weight="bold" text-anchor="middle">Субагент C</text>
<text x="548" y="292" font-size="17" text-anchor="start">Подготовка отчёта.</text>
<text x="548" y="318" font-size="17" text-anchor="start">Написание текста.</text>
<text x="548" y="344" font-size="17" text-anchor="start">Форматирование.</text>
<rect x="20" y="450" width="740" height="250" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="480" font-size="20" font-weight="bold" text-anchor="middle">Последовательный поток</text>
<text x="38" y="512" font-size="18" text-anchor="start">1. Менеджер вызывает A; A возвращает данные.</text>
<text x="38" y="538" font-size="18" text-anchor="start">2. Менеджер передаёт данные B; B возвращает анализ.</text>
<text x="38" y="564" font-size="18" text-anchor="start">3. Менеджер передаёт анализ C; C возвращает отчёт.</text>
<text x="38" y="590" font-size="18" text-anchor="start"></text>
<text x="38" y="616" font-size="18" text-anchor="start">Результат каждого этапа становится входом следующего.</text>
<text x="38" y="642" font-size="18" text-anchor="start">Порядком вызовов и объединением управляет менеджер.</text>
<text x="390" y="745" font-size="18" text-anchor="middle">Для менеджера вызов субагента похож на вызов инструмента:</text>
<text x="390" y="775" font-size="18" text-anchor="middle">запрос → выполнение → ответ.</text>
</g>
</svg>
