<svg xmlns="http://www.w3.org/2000/svg" width="900" height="945" viewBox="0 0 900 945" style="background:#fff"><title>Работа агента и отдельный цикл обучения</title><desc>Редакторская схема с естественной шириной кириллических надписей.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475467"/></marker></defs><g font-family="Arial, sans-serif" fill="#1d2939">
<text x="30" y="42" font-size="26" font-weight="bold">Агент с инструментами: работа и обучение</text>
<text x="30" y="82" font-size="22" font-weight="bold">Сбор траектории: веса модели фиксированы</text>
<rect x="30" y="110" width="240" height="135" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="47" y="148" font-size="23" font-weight="bold">Политика</text>
<text x="47" y="185" font-size="19">Контекст → действие</text>
<text x="47" y="216" font-size="19">или итоговый ответ</text>
<rect x="330" y="110" width="240" height="135" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="347" y="148" font-size="23" font-weight="bold">Инструмент</text>
<text x="347" y="185" font-size="19">API или песочница</text>
<text x="347" y="216" font-size="19">выполняет вызов</text>
<rect x="630" y="110" width="240" height="135" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="647" y="148" font-size="23" font-weight="bold">Наблюдение</text>
<text x="647" y="185" font-size="19">Результат, данные</text>
<text x="647" y="216" font-size="19">или ошибка</text>
<path d="M272 178 L324 178" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<path d="M572 178 L624 178" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<path d="M750 248 L750 282 L150 282 L150 248" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<text x="240" y="317" font-size="19">Результат добавляется в контекст следующего шага</text>
<text x="30" y="374" font-size="22" font-weight="bold">Обучающий цикл: после сбора траекторий</text>
<rect x="30" y="399" width="240" height="140" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="44" y="436" font-size="21" font-weight="bold">Оценка</text>
<text x="44" y="477" font-size="19">Проверка результата</text>
<text x="44" y="508" font-size="19">по критерию задачи</text>
<rect x="330" y="399" width="240" height="140" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="344" y="436" font-size="21" font-weight="bold">Обучающий сигнал</text>
<text x="344" y="477" font-size="19">Награды и оценки</text>
<text x="344" y="508" font-size="19">преимущества</text>
<rect x="630" y="399" width="240" height="140" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="644" y="436" font-size="21" font-weight="bold">Оптимизация</text>
<text x="644" y="477" font-size="19">Функция потерь</text>
<text x="644" y="508" font-size="19">и обновление весов</text>
<path d="M272 470 L324 470" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<path d="M572 470 L624 470" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<path d="M750 542 L885 542 L885 96 L150 96 L150 108" fill="none" stroke="#475467" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
<text x="240" y="609" font-size="19">Обновлённая политика собирает следующие траектории</text>
<text x="30" y="653" font-size="21" font-weight="bold">Ответ инструмента сам по себе не равен награде.</text>
<text x="30" y="709" font-size="22" font-weight="bold">Три задачи обучения работе с инструментами</text>
<text x="30" y="750" font-size="20" font-weight="bold">1. Один инструмент</text>
<text x="30" y="778" font-size="19">Когда вызвать, какие аргументы передать, как обработать ошибку.</text>
<text x="30" y="816" font-size="20" font-weight="bold">2. Выбор инструмента</text>
<text x="30" y="844" font-size="19">Сопоставить задачу возможностям доступных инструментов.</text>
<text x="30" y="882" font-size="20" font-weight="bold">3. Цепочка инструментов</text>
<text x="30" y="910" font-size="19">Учесть зависимости, ограничения, стоимость и критерий завершения.</text>
</g></svg>
