<svg xmlns="http://www.w3.org/2000/svg" width="900" height="855" viewBox="0 0 900 855" style="background:#fff"><title>MiniMind-V: архитектура и обучение</title><desc>Параметры взяты из закреплённого протокола воспроизведения, а не восстановленного исторического запуска.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475467"/></marker></defs><g font-family="Arial, sans-serif" fill="#1d2939">
<text x="30" y="42" font-size="27" font-weight="bold">Визуально-языковая модель MiniMind-V</text>
<text x="30" y="77" font-size="19">Архитектура и этапы обучения; параметры закреплённого протокола</text>
<rect x="55" y="110" width="790" height="130" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="75" y="145" font-size="23" font-weight="bold">Визуальный энкодер CLIP ViT-B/16</text>
<text x="75" y="184" font-size="20">Изображение → последовательность визуальных признаков</text>
<text x="75" y="214" font-size="20">Веса визуального энкодера фиксированы.</text>
<path d="M450 242 L450 276" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<rect x="55" y="280" width="790" height="130" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="75" y="315" font-size="23" font-weight="bold">Проекционный слой</text>
<text x="75" y="354" font-size="20">Отображение в пространство представлений языковой модели</text>
<text x="75" y="384" font-size="20">Обучается на первом этапе и при последующем SFT.</text>
<path d="M450 412 L450 446" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<rect x="55" y="450" width="790" height="130" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="75" y="485" font-size="23" font-weight="bold">Языковая модель MiniMind</text>
<text x="75" y="524" font-size="20">Скрытая размерность 768; визуальные и текстовые представления</text>
<text x="75" y="554" font-size="20">подаются модели совместно для генерации описания.</text>
<text x="30" y="630" font-size="21" font-weight="bold">Этап 1. Выравнивание: LLM заморожена, обучается проекция.</text>
<text x="30" y="670" font-size="21" font-weight="bold">Этап 2. SFT: LLM разморожена; CLIP остаётся замороженным.</text>
<rect x="30" y="708" width="840" height="115" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="50" y="743" font-size="22" font-weight="bold">Граница экспериментального вывода</text>
<text x="50" y="778" font-size="20">Сохранённая слепая оценка не подтверждает общего преимущества</text>
<text x="50" y="808" font-size="20">QK-Norm + Muon для VLM. Это не универсальное ускорение в три раза.</text>
</g></svg>
