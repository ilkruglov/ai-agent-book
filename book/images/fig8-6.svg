<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"><title>Смена исследовательских акцентов: алгоритмы, среда, априорные знания</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs><rect width="900" height="650" fill="white"/><g font-family="Arial, sans-serif" fill="#222">
<text x="450" y="40" font-size="26" text-anchor="middle" font-weight="bold">Смена акцентов в исследованиях агентов</text>
<text x="450" y="76" font-size="19" text-anchor="middle">Историческая интерпретация из «The Second Half»</text>
<text x="135" y="155" font-size="22" text-anchor="middle" font-weight="bold">2015–2016</text>
<rect x="270" y="112" width="575" height="114" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="557" y="143" font-size="23" text-anchor="middle" font-weight="bold">Алгоритмы</text>
<text x="557" y="170" font-size="19" text-anchor="middle">DQN и Atari</text>
<text x="557" y="193" font-size="19" text-anchor="middle">Поиск более сильных методов</text>
<text x="557" y="216" font-size="19" text-anchor="middle">для стандартных задач</text>
<path d="M135 168 V230" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<text x="135" y="288" font-size="22" text-anchor="middle" font-weight="bold">2016–2018</text>
<rect x="270" y="245" width="575" height="114" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="557" y="276" font-size="23" text-anchor="middle" font-weight="bold">Среда</text>
<text x="557" y="303" font-size="19" text-anchor="middle">Gym, Universe, World of Bits</text>
<text x="557" y="326" font-size="19" text-anchor="middle">Dota 2: сложная среда</text>
<text x="557" y="349" font-size="19" text-anchor="middle">и масштабное обучение</text>
<path d="M135 301 V363" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<text x="135" y="421" font-size="22" text-anchor="middle" font-weight="bold">С 2018 года</text>
<rect x="270" y="378" width="575" height="114" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="557" y="409" font-size="23" text-anchor="middle" font-weight="bold">Априорные знания</text>
<text x="557" y="436" font-size="19" text-anchor="middle">GPT-2/3, WebGPT, ChatGPT</text>
<text x="557" y="459" font-size="19" text-anchor="middle">Предобучение даёт основу</text>
<text x="557" y="482" font-size="19" text-anchor="middle">для последующей адаптации</text>
<text x="450" y="561" font-size="22" text-anchor="middle" font-weight="bold">Априорные знания можно получать не только через RL,</text>
<text x="450" y="596" font-size="22" text-anchor="middle">но и посредством языкового предобучения.</text>
<text x="450" y="630" font-size="18" text-anchor="middle">Это смена исследовательского акцента, а не отказ от алгоритмов и среды.</text>
</g></svg>
