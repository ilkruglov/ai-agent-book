<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 985" width="780" height="985" style="background:#fff">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#555"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#222">
<rect x="165" y="20" width="450" height="110" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="50" font-size="20" font-weight="bold" text-anchor="middle">Агент-оркестратор</text>
<text x="183" y="82" font-size="18" text-anchor="start">Параллельный запуск и контроль.</text>
<text x="183" y="108" font-size="18" text-anchor="start">Объединение результатов.</text>
<path d="M390 132 L390 165" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="170" width="740" height="55" rx="6" fill="#ddd" stroke="#555" stroke-width="1.5"/>
<text x="390" y="205" font-size="22" font-weight="bold" text-anchor="middle">Шина сообщений (Message Bus)</text>
<path d="M107 227 L107 266" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="270" width="175" height="170" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="107.5" y="300" font-size="20" font-weight="bold" text-anchor="middle">Агент 1</text>
<text x="38" y="332" font-size="17" text-anchor="start">Сбор</text>
<text x="38" y="358" font-size="17" text-anchor="start">данных</text>
<text x="38" y="384" font-size="17" text-anchor="start">Работает</text>
<text x="107" y="426" font-size="15" text-anchor="middle">Свой контекст</text>
<path d="M295 227 L295 266" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="208" y="270" width="175" height="170" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="295.5" y="300" font-size="20" font-weight="bold" text-anchor="middle">Агент 2</text>
<text x="226" y="332" font-size="17" text-anchor="start">Анализ</text>
<text x="226" y="358" font-size="17" text-anchor="start">содержимого</text>
<text x="226" y="384" font-size="17" text-anchor="start">Работает</text>
<text x="295" y="426" font-size="15" text-anchor="middle">Свой контекст</text>
<path d="M483 227 L483 266" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="396" y="270" width="175" height="170" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="483.5" y="300" font-size="20" font-weight="bold" text-anchor="middle">Агент 3</text>
<text x="414" y="332" font-size="17" text-anchor="start">Создание</text>
<text x="414" y="358" font-size="17" text-anchor="start">диаграмм</text>
<text x="414" y="384" font-size="17" text-anchor="start">Завершён</text>
<text x="483" y="426" font-size="15" text-anchor="middle">Свой контекст</text>
<path d="M671 227 L671 266" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="584" y="270" width="175" height="170" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="671.5" y="300" font-size="20" font-weight="bold" text-anchor="middle">Агент 4</text>
<text x="602" y="332" font-size="17" text-anchor="start">Проверка</text>
<text x="602" y="358" font-size="17" text-anchor="start">формата</text>
<text x="602" y="384" font-size="17" text-anchor="start">Ожидает</text>
<text x="671" y="426" font-size="15" text-anchor="middle">Свой контекст</text>
<rect x="20" y="475" width="740" height="465" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="505" font-size="20" font-weight="bold" text-anchor="middle">Примеры сообщений</text>
<text x="38" y="537" font-size="17" text-anchor="start">Оркестратор → агент 1:</text>
<text x="38" y="563" font-size="17" text-anchor="start">{"type":"start", "task":"собрать статьи arxiv",</text>
<text x="38" y="589" font-size="17" text-anchor="start"> "params":{"query":"LLM-агент"}}</text>
<text x="38" y="615" font-size="17" text-anchor="start"></text>
<text x="38" y="641" font-size="17" text-anchor="start">Агент 3 → оркестратор:</text>
<text x="38" y="667" font-size="17" text-anchor="start">{"type":"completed", "agent_id":"3",</text>
<text x="38" y="693" font-size="17" text-anchor="start"> "result":"charts/fig1.svg создан"}</text>
<text x="38" y="719" font-size="17" text-anchor="start"></text>
<text x="38" y="745" font-size="17" text-anchor="start">Агент 1 → агент 2:</text>
<text x="38" y="771" font-size="17" text-anchor="start">{"type":"data_ready", "source":"agent_1", "file":"raw_data.json"}</text>
<text x="38" y="797" font-size="17" text-anchor="start"></text>
<text x="38" y="823" font-size="17" text-anchor="start">Оркестратор → агент 4, после готовности зависимостей:</text>
<text x="38" y="849" font-size="17" text-anchor="start">{"type":"start", "depends_on":["agent_2","agent_3"]}</text>
<text x="390" y="969" font-size="16" text-anchor="middle">depends_on — поле протокола; выполнение зависимостей проверяет среда.</text>
</g>
</svg>
