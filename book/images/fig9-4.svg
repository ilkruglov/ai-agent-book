<g transform="scale(1 2.15)"><text x="500" y="30" text-anchor="middle" class="t h" transform="translate(500 30) scale(1 0.46511627906976744) translate(-500 -30)" style="font-family: Arial, sans-serif;"><tspan x="500" y="18.6">Опыт в знания: сырая траектория — доказательство, документ знаний — единица повторного </tspan><tspan x="500" y="41.400000000000006">использования</tspan></text><rect x="22" y="78" width="168" height="96" rx="8" class="box"/><text x="106" y="111" text-anchor="middle" class="t h" transform="translate(106 111) scale(1 0.46511627906976744) translate(-106 -111)" style="font-family: Arial, sans-serif;"><tspan x="106" y="99.6">Сырая </tspan><tspan x="106" y="122.39999999999999">траектория</tspan></text><text x="106" y="139" text-anchor="middle" class="t s" transform="translate(106 139) scale(1 0.46511627906976744) translate(-106 -139)" style="font-family: Arial, sans-serif;"><tspan x="106" y="130">Действия, </tspan><tspan x="106" y="148">результаты, среда</tspan></text><text x="106" y="160" text-anchor="middle" class="t s" transform="translate(106 160) scale(1 0.46511627906976744) translate(-106 -160)" style="font-family: Arial, sans-serif;"><tspan x="106" y="151">Неизменяемые </tspan><tspan x="106" y="169">доказательства</tspan></text><rect x="215" y="78" width="168" height="96" rx="8" class="box"/><text x="299" y="111" text-anchor="middle" class="t h" transform="translate(299 111) scale(1 0.46511627906976744) translate(-299 -111)" style="font-family: Arial, sans-serif;"><tspan x="299" y="99.6">Оценка одного </tspan><tspan x="299" y="122.39999999999999">запуска</tspan></text><text x="299" y="139" text-anchor="middle" class="t s" transform="translate(299 139) scale(1 0.46511627906976744) translate(-299 -139)" style="font-family: Arial, sans-serif;"><tspan x="299" y="139">Успех, сбой, метки</tspan></text><text x="299" y="160" text-anchor="middle" class="t s" transform="translate(299 160) scale(1 0.46511627906976744) translate(-299 -160)" style="font-family: Arial, sans-serif;"><tspan x="299" y="142">Сохранить </tspan><tspan x="299" y="160">расположение </tspan><tspan x="299" y="178">доказательств</tspan></text><rect x="408" y="63" width="184" height="126" rx="8" class="accent"/><text x="500" y="97" text-anchor="middle" class="t h" transform="translate(500 97) scale(1 0.46511627906976744) translate(-500 -97)" style="font-family: Arial, sans-serif;"><tspan x="500" y="85.6">Сравнение </tspan><tspan x="500" y="108.39999999999999">траекторий</tspan></text><text x="500" y="128" text-anchor="middle" class="t s" transform="translate(500 128) scale(1 0.46511627906976744) translate(-500 -128)" style="font-family: Arial, sans-serif;"><tspan x="500" y="119">Группировка </tspan><tspan x="500" y="137">однотипных задач</tspan></text><text x="500" y="151" text-anchor="middle" class="t s" transform="translate(500 151) scale(1 0.46511627906976744) translate(-500 -151)" style="font-family: Arial, sans-serif;"><tspan x="500" y="142">Сопоставление успехов </tspan><tspan x="500" y="160">и сбоев</tspan></text><text x="500" y="174" text-anchor="middle" class="t s" transform="translate(500 174) scale(1 0.46511627906976744) translate(-500 -174)" style="font-family: Arial, sans-serif;"><tspan x="500" y="165">Выявление общих черт </tspan><tspan x="500" y="183">и границ</tspan></text><rect x="617" y="63" width="184" height="126" rx="8" class="accent"/><text x="709" y="97" text-anchor="middle" class="t h" transform="translate(709 97) scale(1 0.46511627906976744) translate(-709 -97)" style="font-family: Arial, sans-serif;"><tspan x="709" y="85.6">Документ </tspan><tspan x="709" y="108.39999999999999">Markdown</tspan></text><text x="709" y="128" text-anchor="middle" class="t s" transform="translate(709 128) scale(1 0.46511627906976744) translate(-709 -128)" style="font-family: Arial, sans-serif;"><tspan x="709" y="119">Сценарии применения </tspan><tspan x="709" y="137">и стратегии</tspan></text><text x="709" y="151" text-anchor="middle" class="t s" transform="translate(709 151) scale(1 0.46511627906976744) translate(-709 -151)" style="font-family: Arial, sans-serif;"><tspan x="709" y="142">Исключения, запреты и </tspan><tspan x="709" y="160">источники</tspan></text><text x="709" y="174" text-anchor="middle" class="t s" transform="translate(709 174) scale(1 0.46511627906976744) translate(-709 -174)" style="font-family: Arial, sans-serif;"><tspan x="709" y="165">Версия и время </tspan><tspan x="709" y="183">проверки</tspan></text><rect x="826" y="78" width="240" height="96" rx="8" class="box"/><text x="946" y="111" text-anchor="middle" class="t h" transform="translate(946 111) scale(1 0.46511627906976744) translate(-946 -111)" style="font-family: Arial, sans-serif;"><tspan x="946" y="99.6">Применение через </tspan><tspan x="946" y="122.39999999999999">поиск</tspan></text><text x="946" y="139" text-anchor="middle" class="t s" transform="translate(946 139) scale(1 0.46511627906976744) translate(-946 -139)" style="font-family: Arial, sans-serif;"><tspan x="946" y="130">Загрузка по запросу новой </tspan><tspan x="946" y="148">задачи</tspan></text><text x="946" y="160" text-anchor="middle" class="t s" transform="translate(946 160) scale(1 0.46511627906976744) translate(-946 -160)" style="font-family: Arial, sans-serif;"><tspan x="946" y="151">Продолжение сбора обратной </tspan><tspan x="946" y="169">связи</tspan></text><path d="M190 126 H213" class="line"/><path d="M383 126 H406" class="line"/><path d="M592 126 H615" class="line"/><path d="M801 126 H824" class="line"/><path d="M902 174 V244 H500 V191" class="line" stroke-dasharray="7 5"/><text x="700" y="270" text-anchor="middle" class="t s" transform="translate(700 270) scale(1 0.46511627906976744) translate(-700 -270)" style="font-family: Arial, sans-serif;"><tspan x="700" y="270">Новые доказательства уточняют, ограничивают или отменяют старые знания</tspan></text><rect x="215" y="302" width="586" height="48" rx="8" fill="#fafbfb" stroke="#9aa8af"/><text x="508" y="332" text-anchor="middle" class="t s" transform="translate(508 332) scale(1 0.46511627906976744) translate(-508 -332)" style="font-family: Arial, sans-serif;"><tspan x="508" y="323">Общие с главой 3 извлечение и поиск; здесь добавлен цикл оценки траекторий и </tspan><tspan x="508" y="341">улучшения поведения</tspan></text></g></svg>
