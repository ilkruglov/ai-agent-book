e(-117.5 -484)" style="font-family: Arial, sans-serif;"><tspan x="117.5" y="484">Неудачные пути ↓</tspan></text><path d="M117 358 L117 225 L245 225 L245 125 L260 125" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/><text x="128" y="215" font-family="Arial, sans-serif" font-size="13" fill="#666666" transform="translate(128 215) scale(1 0.8) translate(-128 -215)" style="font-family: Arial, sans-serif;"><tspan x="128" y="215">Следующий step</tspan></text><text x="490" y="555" font-family="Arial, sans-serif" font-size="15" fill="#666666" text-anchor="middle" transform="translate(490 555) scale(1 0.8) translate(-490 -555)" style="font-family: Arial, sans-serif;"><tspan x="490" y="555">Один step: rollout → проверка → сравнение → обновление градиентным спуском</tspan></text><text x="490" y="583" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" transform="translate(490 583) scale(1 0.8) translate(-490 -583)" style="font-family: Arial, sans-serif;"><tspan x="490" y="583">Примерно: rollout ≈ 2,000 s + update ≈ 600 s → step ≈ 2,600 s (около 43 минут)</tspan></text></g></svg>
