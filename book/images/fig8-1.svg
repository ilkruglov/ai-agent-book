<svg xmlns="http://www.w3.org/2000/svg" width="900" height="840" viewBox="0 0 900 840"><title>Цикл взаимодействия агента и среды</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs><rect width="900" height="840" fill="white"/><g font-family="Arial, sans-serif" fill="#222">
<text x="450" y="38" font-size="26" text-anchor="middle" font-weight="bold">Агент, среда и траектория</text>
<rect x="40" y="80" width="320" height="155" rx="7" fill="#f5f5f5" stroke="#666"/>
<rect x="540" y="80" width="320" height="155" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="200" y="111" font-size="23" text-anchor="middle" font-weight="bold">Агент</text>
<text x="200" y="142" font-size="18" text-anchor="middle">Выбирает действие по состоянию</text>
<text x="200" y="167" font-size="18" text-anchor="middle">ε-жадная стратегия при ε = 0,1:</text>
<text x="200" y="192" font-size="18" text-anchor="middle">90% — максимум текущего Q</text>
<text x="200" y="217" font-size="18" text-anchor="middle">10% — случайное действие</text>
<text x="700" y="111" font-size="23" text-anchor="middle" font-weight="bold">Среда</text>
<text x="700" y="142" font-size="18" text-anchor="middle">Обновляет состояние</text>
<text x="700" y="167" font-size="18" text-anchor="middle">и выдаёт вознаграждение</text>
<text x="700" y="192" font-size="18" text-anchor="middle">Комната, инвентарь, двери</text>
<text x="700" y="217" font-size="18" text-anchor="middle">и другие условия игры</text>
<path d="M365 130 H534" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<text x="450" y="113" font-size="19" text-anchor="middle">Действие aₜ</text>
<path d="M535 205 H365" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<text x="450" y="190" font-size="19" text-anchor="middle">sₜ₊₁, rₜ₊₁</text>
<text x="450" y="280" font-size="23" text-anchor="middle" font-weight="bold">Фрагмент траектории: состояние → действие → результат</text>
<text x="175" y="322" font-size="20" text-anchor="middle" font-weight="bold">Состояние</text>
<text x="450" y="322" font-size="20" text-anchor="middle" font-weight="bold">Действие</text>
<text x="725" y="322" font-size="20" text-anchor="middle" font-weight="bold">Результат</text>
<rect x="40" y="340" width="820" height="55" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="175" y="373" font-size="18" text-anchor="middle">Входной холл</text>
<text x="450" y="373" font-size="18" text-anchor="middle">Идти на восток</text>
<text x="725" y="373" font-size="18" text-anchor="middle">Кладовая; r = 0</text>
<rect x="40" y="405" width="820" height="55" rx="7" fill="#edf3f7" stroke="#666"/>
<text x="175" y="438" font-size="18" text-anchor="middle">Кладовая без ключа</text>
<text x="450" y="438" font-size="18" text-anchor="middle">Взять ключ</text>
<text x="725" y="438" font-size="18" text-anchor="middle">Ключ получен; r = +5</text>
<rect x="40" y="470" width="820" height="55" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="175" y="503" font-size="18" text-anchor="middle">Кладовая с ключом</text>
<text x="450" y="503" font-size="18" text-anchor="middle">Идти на север</text>
<text x="725" y="503" font-size="18" text-anchor="middle">Комната стража; r = 0</text>
<rect x="40" y="535" width="820" height="55" rx="7" fill="#edf3f7" stroke="#666"/>
<text x="175" y="568" font-size="18" text-anchor="middle">Комната стража</text>
<text x="450" y="568" font-size="18" text-anchor="middle">Создать серебряный меч</text>
<text x="725" y="568" font-size="18" text-anchor="middle">Меч создан; r = +10</text>
<rect x="40" y="600" width="820" height="55" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="175" y="633" font-size="18" text-anchor="middle">Комната стража с мечом</text>
<text x="450" y="633" font-size="18" text-anchor="middle">Атаковать</text>
<text x="725" y="633" font-size="18" text-anchor="middle">Страж побеждён; r = +50</text>
<text x="450" y="718" font-size="21" text-anchor="middle" font-weight="bold">Цель: максимизировать ожидаемую дисконтированную отдачу</text>
<text x="450" y="758" font-size="25" text-anchor="middle">G = r₁ + γr₂ + γ²r₃ + …</text>
<text x="450" y="796" font-size="19" text-anchor="middle">Комната — лишь часть состояния; учитываются и условия игры.</text>
</g></svg>
