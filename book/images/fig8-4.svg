<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<title>Обновление Q-значения по одному переходу</title>
<desc>Иллюстративный расчёт: старая оценка0,25, шаг0,2, награда5, дисконт0,99 и максимальная оценка следующего состояния0,63. Новая оценка1,32474. Будущая ценность используется для обновления предшествующей пары состояния и действия.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs>
<rect width="900" height="650" fill="white"/>
<g font-family="Arial, sans-serif" fill="#222">
<text x="450" y="40" text-anchor="middle" font-size="25" font-weight="bold">Обновление Q-значения</text>
<text x="450" y="82" text-anchor="middle" font-size="23">Q(s, a) ← Q(s, a) + α [r + γ max Q(s′, a′) − Q(s, a)]</text>
<text x="450" y="111" text-anchor="middle" font-size="18">Максимум берётся по доступным действиям a′ в следующем состоянии.</text>
<rect x="40" y="144" width="340" height="106" rx="8" fill="#f5f5f5" stroke="#666"/>
<text x="210" y="174" text-anchor="middle" font-size="21" font-weight="bold">Состояние s</text>
<text x="210" y="206" text-anchor="middle" font-size="20">Кладовая; ключ ещё не взят</text>
<text x="210" y="234" text-anchor="middle" font-size="20">Q(s, взять ключ) = 0,25</text>
<rect x="520" y="144" width="340" height="106" rx="8" fill="#f5f5f5" stroke="#666"/>
<text x="690" y="174" text-anchor="middle" font-size="21" font-weight="bold">Следующее состояние s′</text>
<text x="690" y="206" text-anchor="middle" font-size="20">Кладовая; ключ в инвентаре</text>
<text x="690" y="234" text-anchor="middle" font-size="20">max Q(s′, a′) = 0,63</text>
<path d="M385 190 H514" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="171" text-anchor="middle" font-size="18">Взять ключ</text>
<text x="450" y="223" text-anchor="middle" font-size="20">r = +5</text>
<path d="M690 260 V287 H210 V263" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="317" text-anchor="middle" font-size="19">Оценка будущего обновляет предшествующую пару (s, a).</text>
<rect x="40" y="346" width="820" height="227" rx="8" fill="#edf3f7" stroke="#667788"/>
<text x="70" y="382" font-size="22" font-weight="bold">Иллюстративные числа: α = 0,2; γ = 0,99</text>
<text x="70" y="423" font-size="22">TD-цель: 5 + 0,99 × 0,63 = 5,6237</text>
<text x="70" y="462" font-size="22">TD-ошибка: 5,6237 − 0,25 = 5,3737</text>
<text x="70" y="503" font-size="22">Новая оценка: 0,25 + 0,2 × 5,3737 = 1,32474</text>
<text x="70" y="545" font-size="20">При округлении до трёх знаков: Q(s, a) ≈ 1,325.</text>
<text x="450" y="609" text-anchor="middle" font-size="19">Это обновление оценки, а не передача награды вперёд по траектории.</text>
</g></svg>
