<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 860 224" width="860" height="224" style="background:#ffffff">
<defs><marker id="ah" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333333"/></marker><marker id="ah-light" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#999999"/></marker></defs>
<text x="220" y="46" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="380.0" lengthAdjust="spacingAndGlyphs">Наивно: описания инструментов в системном промпте</text>
<rect x="30" y="62" width="380" height="70" rx="6" fill="#f0d8d8" stroke="#333333" stroke-width="2"/>
<text x="220" y="84" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="368.0" lengthAdjust="spacingAndGlyphs">Системный промпт + все описания инструментов</text>
<text x="220" y="108" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="368.0" lengthAdjust="spacingAndGlyphs">Инструмент добавлен/удалён → новый префикс → сброс KV-кэша</text>
<rect x="30" y="140" width="380" height="46" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="220" y="163" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="368.0" lengthAdjust="spacingAndGlyphs">Пересчёт на каждой итерации — высокие затраты</text>
<text x="640" y="46" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="380.0" lengthAdjust="spacingAndGlyphs">Оптимизация: динамическая загрузка инструментов</text>
<rect x="450" y="62" width="380" height="40" rx="6" fill="#d8e8d8" stroke="#333333" stroke-width="2"/>
<text x="640" y="82" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" textLength="368.0" lengthAdjust="spacingAndGlyphs">Стабильный системный промпт (попадание в кэш)</text>
<rect x="450" y="106" width="380" height="40" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="640" y="126" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="368.0" lengthAdjust="spacingAndGlyphs">Описания инструментов по запросу (меняются)</text>
<rect x="450" y="150" width="380" height="40" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="640" y="170" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal">Траектория диалога</text>
<text x="640" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="380.0" lengthAdjust="spacingAndGlyphs">Стабильный префикс не меняется → KV-кэш используется повторно</text>
<line x1="430" y1="54" x2="430" y2="220" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
</svg>