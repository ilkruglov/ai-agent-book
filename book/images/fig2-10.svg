<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 93.5 820 752.25" width="820" height="752.25" style="background:#ffffff">
<title>Рис. 2-10. Prompt Cache: повторное использование префиксного KV-кэша между запросами</title>
<desc>Три запроса показывают повторное использование префиксного KV-кэша через Prompt Cache: запрос 1 создаёт кэш, запрос 2 попадает в кэш благодаря неизменному префиксу, а в запросе 3 динамическая временная метка в начале системного промпта вынуждает заново вычислить и оплатить все токены после точки изменения.</desc>
<defs><marker id="ah-light" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#999999"/></marker></defs>








































