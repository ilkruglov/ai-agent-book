<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" style="background:#fff"><title>ReTool: цикл инструмента и результаты</title><desc>Схема с раздельным указанием примера работы, экспериментальных результатов и границ сравнения.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475467"/></marker></defs><g font-family="Arial, sans-serif" fill="#1d2939">
<text x="30" y="42" font-size="27" font-weight="bold">ReTool: рассуждение с исполнением кода</text>
<text x="30" y="77" font-size="20">Условный пример: решить уравнение x² + 2x − 8 = 0</text>
<rect x="55" y="105" width="790" height="80" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="75" y="136" font-size="22" font-weight="bold">1. Модель выбирает вычисление</text>
<text x="75" y="170" font-size="20">Рассуждение: «Проверю корни с помощью SymPy».</text>
<path d="M450 187 L450 215" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<rect x="55" y="220" width="790" height="110" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="75" y="251" font-size="22" font-weight="bold">2. Код выполняется в песочнице</text>
<text x="75" y="285" font-size="20">from sympy import symbols, solve</text>
<text x="75" y="314" font-size="20">x = symbols('x'); print(solve(x**2 + 2*x - 8, x))</text>
<path d="M450 332 L450 360" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<rect x="55" y="365" width="790" height="110" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="75" y="396" font-size="22" font-weight="bold">3. Результат возвращается в контекст</text>
<text x="75" y="430" font-size="20">Вывод интерпретатора: [−4, 2]</text>
<text x="75" y="459" font-size="20">Модель проверяет результат и формирует ответ: x = −4 или x = 2.</text>
<text x="30" y="517" font-size="20">Ошибка исполнения тоже возвращается модели для исправления.</text>
<rect x="30" y="550" width="840" height="145" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="50" y="586" font-size="23" font-weight="bold">Обучение и результат статьи</text>
<text x="50" y="620" font-size="20">Qwen2.5-32B-Instruct → SFT для прогрева → PPO с инструментом</text>
<text x="50" y="651" font-size="20">AIME 2024: исходная модель 26,7%; после SFT 40,9%;</text>
<text x="50" y="681" font-size="20">после 400 шагов RL — 67,0%. Это результаты указанного протокола.</text>
<text x="30" y="744" font-size="22" font-weight="bold">Не объединять разные эксперименты в одну кривую</text>
<text x="30" y="778" font-size="20">52% после примерно 110 шагов в сопроводительных материалах</text>
<text x="30" y="809" font-size="20">относится к AIME 2025, а не к той же точке сравнения на AIME 2024.</text>
</g></svg>
