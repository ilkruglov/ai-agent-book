 y="307.6">Далее возможно использование </tspan><tspan x="600" y="324.40000000000003">из кэша как части истории</tspan></text><text x="600" y="448.0" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold" transform="translate(600 448) scale(1 0.6060606060606061) translate(-600 -448)" style="font-family: Arial, sans-serif;"><tspan x="600" y="439.6">Удаление или перестановка </tspan><tspan x="600" y="456.40000000000003">загруженных инструментов:</tspan></text><text x="600" y="470.0" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" transform="translate(600 470) scale(1 0.6060606060606061) translate(-600 -470)" style="font-family: Arial, sans-serif;"><tspan x="600" y="461.6">пересчёт начинается с точки </tspan><tspan x="600" y="478.40000000000003">изменения</tspan></text></g></svg>
