<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 940" width="780" height="940" style="background:#fff">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#555"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#222">
<rect x="20" y="25" width="320" height="340" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="180" y="55" font-size="20" font-weight="bold" text-anchor="middle">Агент-редактор</text>
<text x="38" y="87" font-size="16" text-anchor="start">Вход: аннотация статьи</text>
<text x="38" y="113" font-size="16" text-anchor="start">объёмом 2000 знаков.</text>
<text x="38" y="139" font-size="16" text-anchor="start">Разбивает материал на слайды.</text>
<text x="38" y="165" font-size="16" text-anchor="start"></text>
<text x="38" y="191" font-size="16" text-anchor="start">Пример Slidev:</text>
<text x="38" y="217" font-size="16" text-anchor="start">theme: academic</text>
<text x="38" y="243" font-size="16" text-anchor="start"># Внимание Transformer</text>
<text x="38" y="269" font-size="16" text-anchor="start">## Основная идея</text>
<text x="38" y="295" font-size="16" text-anchor="start">Оценки внимания: Q·Kᵀ/√d</text>
<text x="38" y="321" font-size="16" text-anchor="start">Несколько голов параллельно.</text>
<rect x="440" y="25" width="320" height="340" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="600" y="55" font-size="20" font-weight="bold" text-anchor="middle">Агент-рецензент</text>
<text x="458" y="87" font-size="16" text-anchor="start">Рендеринг Slidev → PDF/PNG.</text>
<text x="458" y="113" font-size="16" text-anchor="start">Визуальная оценка результата.</text>
<text x="458" y="139" font-size="16" text-anchor="start"></text>
<text x="458" y="165" font-size="16" text-anchor="start">Структурированный отзыв:</text>
<text x="458" y="191" font-size="16" text-anchor="start">P3: перегрузка — высокая</text>
<text x="458" y="217" font-size="16" text-anchor="start">критичность.</text>
<text x="458" y="243" font-size="16" text-anchor="start">P7: мелкий шрифт — средняя.</text>
<text x="458" y="269" font-size="16" text-anchor="start">P11: плохие цвета — низкая.</text>
<text x="458" y="295" font-size="16" text-anchor="start"></text>
<text x="458" y="321" font-size="16" text-anchor="start">На выходе — конкретные правки.</text>
<path d="M342 138 L438 138" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390" y="122" font-size="17" font-weight="bold" text-anchor="middle">Slidev</text>
<path d="M438 265 L342 265" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390" y="290" font-size="17" font-weight="bold" text-anchor="middle">Отзыв</text>
<text x="390" y="410" font-size="22" font-weight="bold" text-anchor="middle">Итеративная доработка: условный пример</text>
<rect x="20" y="440" width="225" height="190" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="132.5" y="470" font-size="20" font-weight="bold" text-anchor="middle">Раунд 1</text>
<text x="38" y="502" font-size="16" text-anchor="start">12 страниц.</text>
<text x="38" y="528" font-size="16" text-anchor="start">Черновик.</text>
<text x="38" y="554" font-size="16" text-anchor="start">Выявлено 5 проблем.</text>
<rect x="278" y="440" width="225" height="190" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390.5" y="470" font-size="20" font-weight="bold" text-anchor="middle">Раунд 2</text>
<text x="296" y="502" font-size="16" text-anchor="start">14 страниц.</text>
<text x="296" y="528" font-size="16" text-anchor="start">Перегруженные слайды</text>
<text x="296" y="554" font-size="16" text-anchor="start">разделены.</text>
<text x="296" y="580" font-size="16" text-anchor="start">Осталось 2 проблемы.</text>
<rect x="535" y="440" width="225" height="190" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="647.5" y="470" font-size="20" font-weight="bold" text-anchor="middle">Раунд 3</text>
<text x="553" y="502" font-size="16" text-anchor="start">14 страниц.</text>
<text x="553" y="528" font-size="16" text-anchor="start">Исправлен шрифт.</text>
<text x="553" y="554" font-size="16" text-anchor="start">Проверка не выявила</text>
<text x="553" y="580" font-size="16" text-anchor="start">прежних проблем.</text>
<path d="M247 525 L274 525" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M505 525 L531 525" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="670" width="740" height="240" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="700" font-size="20" font-weight="bold" text-anchor="middle">Зачем разделять контексты?</text>
<text x="38" y="732" font-size="17" text-anchor="start">Повторные изображения слайдов увеличивают контекст.</text>
<text x="38" y="758" font-size="17" text-anchor="start">Точная стоимость изображения зависит от модели и режима ввода.</text>
<text x="38" y="784" font-size="17" text-anchor="start">Рецензенту можно передавать только текущие рендеры и критерии,</text>
<text x="38" y="810" font-size="17" text-anchor="start">редактору — исходники и структурированные отзывы.</text>
<text x="38" y="836" font-size="17" text-anchor="start">Но два агента сами по себе не дают «чистого контекста»:</text>
<text x="38" y="862" font-size="17" text-anchor="start">правила передачи, сброса истории и бюджет задаёт среда.</text>
</g>
</svg>
