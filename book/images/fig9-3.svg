<g transform="scale(1 1.95)"><text x="500" y="30" text-anchor="middle" class="t h" transform="translate(500 30) scale(1 0.5128205128205129) translate(-500 -30)" style="font-family: Arial, sans-serif;"><tspan x="500" y="30">Форма представления способности определяет место обновления</tspan></text><rect x="35" y="72" width="220" height="126" rx="9" class="box"/><text x="145" y="105" text-anchor="middle" class="t h" transform="translate(145 105) scale(1 0.5128205128205129) translate(-145 -105)" style="font-family: Arial, sans-serif;"><tspan x="145" y="105">Знания</tspan></text><text x="145" y="135" text-anchor="middle" class="t s" transform="translate(145 135) scale(1 0.5128205128205129) translate(-145 -135)" style="font-family: Arial, sans-serif;"><tspan x="145" y="135">Факты, опыт и исключения</tspan></text><text x="145" y="164" text-anchor="middle" class="t s" transform="translate(145 164) scale(1 0.5128205128205129) translate(-145 -164)" style="font-family: Arial, sans-serif;"><tspan x="145" y="164">Markdown / база знаний</tspan></text><rect x="275" y="72" width="220" height="126" rx="9" class="box"/><text x="385" y="105" text-anchor="middle" class="t h" transform="translate(385 105) scale(1 0.5128205128205129) translate(-385 -105)" style="font-family: Arial, sans-serif;"><tspan x="385" y="105">Инструкции</tspan></text><text x="385" y="135" text-anchor="middle" class="t s" transform="translate(385 135) scale(1 0.5128205128205129) translate(-385 -135)" style="font-family: Arial, sans-serif;"><tspan x="385" y="125.4">Формулируемые принципы </tspan><tspan x="385" y="144.6">решений</tspan></text><text x="385" y="164" text-anchor="middle" class="t s" transform="translate(385 164) scale(1 0.5128205128205129) translate(-385 -164)" style="font-family: Arial, sans-serif;"><tspan x="385" y="164">Prompt / Skill</tspan></text><rect x="515" y="72" width="220" height="126" rx="9" class="box"/><text x="625" y="105" text-anchor="middle" class="t h" transform="translate(625 105) scale(1 0.5128205128205129) translate(-625 -105)" style="font-family: Arial, sans-serif;"><tspan x="625" y="105">Программы</tspan></text><text x="625" y="135" text-anchor="middle" class="t s" transform="translate(625 135) scale(1 0.5128205128205129) translate(-625 -135)" style="font-family: Arial, sans-serif;"><tspan x="625" y="115.8">Детерминированные </tspan><tspan x="625" y="135">процессы и строгие </tspan><tspan x="625" y="154.2">ограничения</tspan></text><text x="625" y="164" text-anchor="middle" class="t s" transform="translate(625 164) scale(1 0.5128205128205129) translate(-625 -164)" style="font-family: Arial, sans-serif;"><tspan x="625" y="154.4">Инструменты / рабочие </tspan><tspan x="625" y="173.6">процессы / Harness</tspan></text><rect x="755" y="72" width="220" height="126" rx="9" class="accent"/><text x="865" y="105" text-anchor="middle" class="t h" transform="translate(865 105) scale(1 0.5128205128205129) translate(-865 -105)" style="font-family: Arial, sans-serif;"><tspan x="865" y="105">Параметры</tspan></text><text x="865" y="135" text-anchor="middle" class="t s" transform="translate(865 135) scale(1 0.5128205128205129) translate(-865 -135)" style="font-family: Arial, sans-serif;"><tspan x="865" y="125.4">Многомерное восприятие </tspan><tspan x="865" y="144.6">и неявные политики</tspan></text><text x="865" y="164" text-anchor="middle" class="t s" transform="translate(865 164) scale(1 0.5128205128205129) translate(-865 -164)" style="font-family: Arial, sans-serif;"><tspan x="865" y="164">SFT / дистилляция / RL</tspan></text><line x1="145" y1="226" x2="865" y2="226" stroke="#33434d" stroke-width="2"/><path d="M145 218 V234 M865 218 V234" stroke="#33434d" stroke-width="2"/><text x="145" y="260" text-anchor="middle" class="t s" transform="translate(145 260) scale(1 0.5128205128205129) translate(-145 -260)" style="font-family: Arial, sans-serif;"><tspan x="145" y="260">Легко обновлять и отслеживать</tspan></text><text x="865" y="260" text-anchor="middle" class="t s" transform="translate(865 260) scale(1 0.5128205128205129) translate(-865 -260)" style="font-family: Arial, sans-serif;"><tspan x="865" y="250.4">Интернализация, низкие затраты </tspan><tspan x="865" y="269.6">на инференс</tspan></text><text x="500" y="289" text-anchor="middle" class="t h" transform="translate(500 289) scale(1 0.5128205128205129) translate(-500 -289)" style="font-family: Arial, sans-serif;"><tspan x="500" y="289">Не лестница, а четыре взаимодополняющих носителя</tspan></text><rect x="145" y="320" width="710" height="58" rx="8" class="accent"/><text x="500" y="344" text-anchor="middle" class="t h" transform="translate(500 344) scale(1 0.5128205128205129) translate(-500 -344)" style="font-family: Arial, sans-serif;"><tspan x="500" y="332">Первый вопрос: можно ли полностью выразить способность </tspan><tspan x="500" y="356">фактами, языковыми правилами или программой?</tspan></text><text x="500" y="367" text-anchor="middle" class="t s" transform="translate(500 367) scale(1 0.5128205128205129) translate(-500 -367)" style="font-family: Arial, sans-serif;"><tspan x="500" y="357.4">Способ развёртывания задают стабильность, стоимость и частота обновлений, а не </tspan><tspan x="500" y="376.59999999999997">возможность параметризации</tspan></text></g></svg>
