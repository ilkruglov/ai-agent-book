<svg xmlns="http://www.w3.org/2000/svg" width="900" height="855" viewBox="0 0 900 855" style="background:#fff"><title>Одно- и многошаговое обучение</title><desc>Редакторская схема с естественной шириной кириллических надписей.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475467"/></marker></defs><g font-family="Arial, sans-serif" fill="#1d2939">
<text x="30" y="42" font-size="27" font-weight="bold">Одна генерация и взаимодействие со средой</text>
<rect x="30" y="75" width="405" height="245" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="48" y="111" font-size="23" font-weight="bold">Одна генерация ответа</text>
<text x="48" y="151" font-size="19">Промпт → рассуждение → ответ</text>
<text x="48" y="184" font-size="19">Проверка готового результата</text>
<text x="48" y="217" font-size="19">Пример: режимы AdaptThink</text>
<text x="48" y="250" font-size="19">Вознаграждение может поступать</text>
<text x="48" y="283" font-size="19">только после длинного ответа.</text>
<rect x="465" y="75" width="405" height="245" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="483" y="111" font-size="23" font-weight="bold">Несколько взаимодействий</text>
<text x="483" y="151" font-size="19">Наблюдение → действие → среда</text>
<text x="483" y="184" font-size="19">Новое наблюдение → новый шаг</text>
<text x="483" y="217" font-size="19">Примеры: V-IRL, AWorld</text>
<text x="483" y="250" font-size="19">Вознаграждение бывает итоговым,</text>
<text x="483" y="283" font-size="19">промежуточным или смешанным.</text>
<rect x="30" y="350" width="840" height="115" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="50" y="384" font-size="22" font-weight="bold">GeneralPoints — не строго одношаговая задача</text>
<text x="50" y="419" font-size="20">В исследовании агент может исправлять ответ после обратной связи.</text>
<text x="50" y="448" font-size="20">Число итераций задаётся протоколом обучения и оценки.</text>
<text x="30" y="515" font-size="23" font-weight="bold">Что меняется при удлинении траектории</text>
<text x="30" y="545" font-size="21" font-weight="bold">Распределение заслуг</text>
<text x="30" y="576" font-size="19">Даже внутри одного ответа нужно оценить вклад отдельных решений.</text>
<text x="30" y="605" font-size="19">Дополнительные действия и задержки усложняют эту оценку.</text>
<text x="30" y="651" font-size="21" font-weight="bold">Состояние и наблюдения</text>
<text x="30" y="682" font-size="19">Полнота наблюдений зависит от задачи, а не только от числа раундов.</text>
<text x="30" y="711" font-size="19">В интерактивной среде часто нужны история и отслеживание состояния.</text>
<text x="30" y="757" font-size="21" font-weight="bold">Цена исследования</text>
<text x="30" y="788" font-size="19">Считают токены, вызовы инструментов, время и стоимость всей траектории.</text>
<text x="30" y="817" font-size="19">Одного числа раундов для сравнения затрат недостаточно.</text>
</g></svg>
