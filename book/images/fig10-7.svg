<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1080" width="780" height="1080" style="background:#fff">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#555"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#222">
<text x="200" y="30" font-size="22" font-weight="bold" text-anchor="middle">Телефонный агент</text>
<text x="580" y="30" font-size="22" font-weight="bold" text-anchor="middle">Компьютерный агент</text>
<text x="200" y="57" font-size="17" text-anchor="middle">Node.js · голосовая связь</text>
<text x="580" y="57" font-size="17" text-anchor="middle">Python · браузер</text>
<rect x="20" y="80" width="350" height="85" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="195" y="110" font-size="20" font-weight="bold" text-anchor="middle">Речь пользователя</text>
<text x="38" y="142" font-size="16" text-anchor="start">Вход с микрофона</text>
<path d="M195 167 L195 187" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="190" width="350" height="85" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="195" y="220" font-size="20" font-weight="bold" text-anchor="middle">VAD + ASR</text>
<text x="38" y="252" font-size="16" text-anchor="start">Silero VAD → расшифровка</text>
<path d="M195 277 L195 297" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="300" width="350" height="85" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="195" y="330" font-size="20" font-weight="bold" text-anchor="middle">Инференс LLM</text>
<text x="38" y="362" font-size="16" text-anchor="start">Намерение и извлечение данных</text>
<path d="M195 387 L195 407" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="410" width="350" height="85" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="195" y="440" font-size="20" font-weight="bold" text-anchor="middle">Синтез TTS</text>
<text x="38" y="472" font-size="16" text-anchor="start">Создание и воспроизведение ответа</text>
<rect x="410" y="80" width="350" height="85" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="585" y="110" font-size="20" font-weight="bold" text-anchor="middle">Снимок экрана</text>
<text x="428" y="142" font-size="16" text-anchor="start">Текущая страница браузера</text>
<path d="M585 167 L585 187" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="410" y="190" width="350" height="85" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="585" y="220" font-size="20" font-weight="bold" text-anchor="middle">Vision LLM</text>
<text x="428" y="252" font-size="16" text-anchor="start">Структура и поля формы</text>
<path d="M585 277 L585 297" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="410" y="300" width="350" height="85" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="585" y="330" font-size="20" font-weight="bold" text-anchor="middle">План действий</text>
<text x="428" y="362" font-size="16" text-anchor="start">Поля и порядок ввода</text>
<path d="M585 387 L585 407" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="410" y="410" width="350" height="85" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="585" y="440" font-size="20" font-weight="bold" text-anchor="middle">Выполнение</text>
<text x="428" y="472" font-size="16" text-anchor="start">Нажать / ввести / отправить</text>
<rect x="20" y="530" width="740" height="82" rx="6" fill="#ddd" stroke="#555" stroke-width="1.5"/>
<text x="390" y="558" font-size="22" font-weight="bold" text-anchor="middle">Двусторонняя связь WebSocket</text>
<text x="390" y="585" font-size="18" text-anchor="middle">ws://localhost:8849 — локальный учебный пример</text>
<rect x="20" y="640" width="740" height="295" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="670" font-size="20" font-weight="bold" text-anchor="middle">Пример обмена</text>
<text x="38" y="702" font-size="16" text-anchor="start">Телефон → компьютер:</text>
<text x="38" y="728" font-size="16" text-anchor="start">[FROM_PHONE_AGENT] Пользователь назвал имя Чжан Сань.</text>
<text x="38" y="754" font-size="16" text-anchor="start">Компьютер → телефон:</text>
<text x="38" y="780" font-size="16" text-anchor="start">[FROM_COMPUTER_AGENT] Имя заполнено, нужен номер документа.</text>
<text x="38" y="806" font-size="16" text-anchor="start">Телефон → компьютер:</text>
<text x="38" y="832" font-size="16" text-anchor="start">[FROM_PHONE_AGENT] Номер документа 310101199001011234.</text>
<text x="38" y="858" font-size="16" text-anchor="start">Компьютер → телефон:</text>
<text x="38" y="884" font-size="16" text-anchor="start">[FROM_COMPUTER_AGENT] Форма отправлена, регистрация завершена.</text>
<text x="390" y="968" font-size="17" text-anchor="middle">Имена и номер документа здесь — иллюстративные данные.</text>
<text x="390" y="1005" font-size="18" font-weight="bold" text-anchor="middle">Два независимых цикла могут работать одновременно.</text>
<text x="390" y="1035" font-size="17" text-anchor="middle">Асинхронная связь не устраняет гонки, ожидания и проверку</text>
<text x="390" y="1060" font-size="17" text-anchor="middle">результата отправки формы.</text>
</g>
</svg>
