<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880"><title>GeneralPoints: отдельные сдвиги правил и изображений</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs><rect width="900" height="880" fill="white"/><g font-family="Arial, sans-serif" fill="#222">
<text x="450" y="39" font-size="24" text-anchor="middle" font-weight="bold">GeneralPoints: обобщение в конкретном эксперименте</text>
<rect x="40" y="80" width="390" height="157" rx="7" fill="#f5f5f5" stroke="#666"/>
<rect x="470" y="80" width="390" height="157" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="235" y="115" font-size="22" text-anchor="middle" font-weight="bold">Изменение правил</text>
<text x="235" y="152" font-size="20" text-anchor="middle">GP-L и GP-VL</text>
<text x="235" y="186" font-size="19" text-anchor="middle">Обучение: J, Q, K равны 10</text>
<text x="235" y="218" font-size="19" text-anchor="middle">Оценка: J = 11, Q = 12, K = 13</text>
<text x="665" y="115" font-size="22" text-anchor="middle" font-weight="bold">Изменение изображения</text>
<text x="665" y="152" font-size="20" text-anchor="middle">GP-VL</text>
<text x="665" y="186" font-size="19" text-anchor="middle">Обучение: чёрные масти</text>
<text x="665" y="218" font-size="19" text-anchor="middle">Оценка: красные масти</text>
<text x="450" y="280" font-size="22" text-anchor="middle" font-weight="bold">Основа: Llama-3.2-Vision-11B после SFT-инициализации</text>
<text x="450" y="320" font-size="21" text-anchor="middle">Две ветви продолжения обучения: SFT и PPO</text>
<text x="450" y="355" font-size="19" text-anchor="middle">Задача: получить 24 из четырёх чисел; допускаются исправления по проверке.</text>
<rect x="40" y="392" width="820" height="273" rx="7" fill="#edf3f7" stroke="#666"/>
<text x="450" y="427" font-size="22" text-anchor="middle" font-weight="bold">OOD-результаты: до и после продолжения обучения</text>
<text x="202" y="466" font-size="20" text-anchor="middle" font-weight="bold">Оценка</text>
<text x="480" y="466" font-size="20" text-anchor="middle" font-weight="bold">SFT</text>
<text x="728" y="466" font-size="20" text-anchor="middle" font-weight="bold">RL</text>
<text x="202" y="506" font-size="19" text-anchor="middle">Правила, GP-L</text>
<text x="480" y="506" font-size="20" text-anchor="middle">11,5% → 3,4%</text>
<text x="728" y="506" font-size="20" text-anchor="middle">11,5% → 15,0%</text>
<text x="480" y="531" font-size="18" text-anchor="middle">−8,1 п. п.</text>
<text x="728" y="531" font-size="18" text-anchor="middle">+3,5 п. п.</text>
<text x="202" y="571" font-size="19" text-anchor="middle">Правила, GP-VL</text>
<text x="480" y="571" font-size="20" text-anchor="middle">11,2% → 5,6%</text>
<text x="728" y="571" font-size="20" text-anchor="middle">11,2% → 14,2%</text>
<text x="480" y="596" font-size="18" text-anchor="middle">−5,6 п. п.</text>
<text x="728" y="596" font-size="18" text-anchor="middle">+3,0 п. п.</text>
<text x="202" y="636" font-size="19" text-anchor="middle">Изображение, GP-VL</text>
<text x="480" y="636" font-size="20" text-anchor="middle">23,6% → 13,7%</text>
<text x="728" y="636" font-size="20" text-anchor="middle">23,6% → 41,2%</text>
<text x="480" y="661" font-size="18" text-anchor="middle">−9,9 п. п.</text>
<text x="728" y="661" font-size="18" text-anchor="middle">+17,6 п. п.</text>
<text x="450" y="708" font-size="20" text-anchor="middle" font-weight="bold">В этой постановке RL улучшил измеренный перенос, а SFT ухудшил.</text>
<text x="450" y="745" font-size="20" text-anchor="middle">Это не универсальный закон «SFT запоминает, RL обобщает».</text>
<text x="450" y="783" font-size="19" text-anchor="middle">Неструктурированный вывод затруднял полезный сигнал без SFT;</text>
<text x="450" y="814" font-size="19" text-anchor="middle">саму функцию награды можно определить и для невалидного ответа.</text>
<text x="450" y="852" font-size="18" text-anchor="middle">Численные изменения выше выражены в процентных пунктах.</text>
</g></svg>
