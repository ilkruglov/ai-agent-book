<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 900" width="780" height="900" style="background:#fff">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#555"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#222">
<rect x="170" y="20" width="440" height="78" rx="6" fill="#e0e0e0" stroke="#555" stroke-width="1.5"/>
<text x="390" y="47" font-size="22" font-weight="bold" text-anchor="middle">Агент-оркестратор</text>
<text x="390" y="71" font-size="16" text-anchor="middle">Создаёт исполнителей, проверяет результат</text>
<text x="390" y="90" font-size="16" text-anchor="middle">и управляет отменой</text>
<path d="M390 100 L90 135" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="140" width="140" height="110" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="90" y="165" font-size="18" font-weight="bold" text-anchor="middle">Агент 1</text>
<text x="90" y="189" font-size="14" text-anchor="middle">cs.edu.cn</text>
<text x="90" y="213" font-size="14" text-anchor="middle">Поиск в каталоге</text>
<text x="90" y="235" font-size="14" text-anchor="middle">ожидает отмены</text>
<path d="M390 100 L240 135" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="170" y="140" width="140" height="110" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="240" y="165" font-size="18" font-weight="bold" text-anchor="middle">Агент 2</text>
<text x="240" y="189" font-size="14" text-anchor="middle">math.edu.cn</text>
<text x="240" y="213" font-size="14" text-anchor="middle">Поиск в каталоге</text>
<text x="240" y="235" font-size="14" text-anchor="middle">нет совпадения</text>
<path d="M390 100 L390 135" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="320" y="140" width="140" height="110" rx="6" fill="#ddd" stroke="#555" stroke-width="1.5"/>
<text x="390" y="165" font-size="18" font-weight="bold" text-anchor="middle">Агент 3</text>
<text x="390" y="189" font-size="14" text-anchor="middle">phys.edu.cn</text>
<text x="390" y="213" font-size="14" text-anchor="middle">Поиск в каталоге</text>
<text x="390" y="235" font-size="14" text-anchor="middle">есть кандидат</text>
<path d="M390 100 L540 135" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470" y="140" width="140" height="110" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="540" y="165" font-size="18" font-weight="bold" text-anchor="middle">Агент 4</text>
<text x="540" y="189" font-size="14" text-anchor="middle">chem.edu.cn</text>
<text x="540" y="213" font-size="14" text-anchor="middle">Поиск в каталоге</text>
<text x="540" y="235" font-size="14" text-anchor="middle">остановлен</text>
<path d="M390 100 L690 135" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="620" y="140" width="140" height="110" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="690" y="165" font-size="18" font-weight="bold" text-anchor="middle">Агент 5</text>
<text x="690" y="189" font-size="14" text-anchor="middle">bio.edu.cn</text>
<text x="690" y="213" font-size="14" text-anchor="middle">Поиск в каталоге</text>
<text x="690" y="235" font-size="14" text-anchor="middle">остановлен</text>
<text x="390" y="282" font-size="15" text-anchor="middle">Состояния приведены для иллюстрации этапов, не одного момента</text>
<rect x="20" y="302" width="740" height="352" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="331" font-size="21" font-weight="bold" text-anchor="middle">Пример последовательности: время условное</text>
<text x="42" y="362" font-size="16" font-weight="bold" text-anchor="start">0 с</text>
<text x="122" y="362" font-size="15" text-anchor="start">Запущены пять поисков преподавателя «Чжан Вэй».</text>
<path d="M78 369 L78 388" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="42" y="405" font-size="16" font-weight="bold" text-anchor="start">12 с</text>
<text x="122" y="405" font-size="15" text-anchor="start">Агент 2 завершил обход: на проверенных страницах совпадений нет.</text>
<path d="M78 412 L78 431" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="42" y="448" font-size="16" font-weight="bold" text-anchor="start">18 с</text>
<text x="122" y="448" font-size="15" text-anchor="start">Агент 3 передал target_found, источник и признаки совпадения.</text>
<path d="M78 455 L78 474" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="42" y="491" font-size="16" font-weight="bold" text-anchor="start">18,1 с</text>
<text x="122" y="491" font-size="15" text-anchor="start">Manager проверил идентичность и полноту сведений.</text>
<path d="M78 498 L78 517" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="42" y="534" font-size="16" font-weight="bold" text-anchor="start">18,2 с</text>
<text x="122" y="534" font-size="15" text-anchor="start">Победитель зафиксирован атомарно; остальным отправлена отмена.</text>
<path d="M78 541 L78 560" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="42" y="577" font-size="16" font-weight="bold" text-anchor="start">19 с</text>
<text x="122" y="577" font-size="15" text-anchor="start">Получены подтверждения остановки; результат собран.</text>
<text x="390" y="630" font-size="16" font-weight="bold" text-anchor="middle">Нет подтверждения отмены → тайм-аут, сверка состояния и ресурсов</text>
<rect x="20" y="675" width="350" height="150" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<rect x="390" y="675" width="370" height="150" rx="6" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
<text x="195" y="703" font-size="21" font-weight="bold" text-anchor="middle">Проверенный результат</text>
<text x="36" y="732" font-size="16" text-anchor="start">Имя: Чжан Вэй</text>
<text x="36" y="758" font-size="16" text-anchor="start">Факультет: физический; профессор</text>
<text x="36" y="784" font-size="16" text-anchor="start">Область: квантовые вычисления</text>
<text x="36" y="810" font-size="16" text-anchor="start">Почта: zhangwei@phys.edu.cn</text>
<text x="575" y="703" font-size="21" font-weight="bold" text-anchor="middle">Условная оценка времени</text>
<text x="406" y="732" font-size="16" text-anchor="start">10 сайтов последовательно:</text>
<text x="406" y="758" font-size="16" text-anchor="start">10 × 30 с = 5 минут.</text>
<text x="406" y="784" font-size="16" text-anchor="start">В примере ранний успех и отмена</text>
<text x="406" y="810" font-size="16" text-anchor="start">заняли 19 с. Это не бенчмарк.</text>
<text x="390" y="852" font-size="17" text-anchor="middle">Ранний успех отменяет альтернативные попытки одной цели,</text>
<text x="390" y="877" font-size="17" text-anchor="middle">но не обязательные части составного результата.</text>
</g>
</svg>
