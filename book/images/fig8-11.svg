<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790"><title>SFT и RL: выбор метода по причине ошибки</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs><rect width="900" height="790" fill="white"/><g font-family="Arial, sans-serif" fill="#222">
<text x="450" y="39" font-size="23" text-anchor="middle" font-weight="bold">SFT и RL: дополняющие методы, не обязательная лестница</text>
<rect x="40" y="85" width="390" height="220" rx="7" fill="#f5f5f5" stroke="#666"/>
<rect x="470" y="85" width="390" height="220" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="235" y="121" font-size="26" text-anchor="middle" font-weight="bold">SFT</text>
<text x="665" y="121" font-size="26" text-anchor="middle" font-weight="bold">RL</text>
<text x="235" y="166" font-size="19" text-anchor="middle">Демонстрации желаемого поведения</text>
<text x="235" y="200" font-size="19" text-anchor="middle">Максимизация вероятности ответов</text>
<text x="235" y="234" font-size="19" text-anchor="middle">Помогает закрепить формат</text>
<text x="235" y="268" font-size="19" text-anchor="middle">и действия по примерам</text>
<text x="665" y="166" font-size="19" text-anchor="middle">Оптимизация ожидаемой награды</text>
<text x="665" y="200" font-size="19" text-anchor="middle">Поиск и оценка разных траекторий</text>
<text x="665" y="234" font-size="19" text-anchor="middle">Нужны полезный сигнал</text>
<text x="665" y="268" font-size="19" text-anchor="middle">и подходящие взаимодействия</text>
<text x="450" y="352" font-size="24" text-anchor="middle" font-weight="bold">Диагностика перед обучением</text>
<rect x="40" y="379" width="820" height="71" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="450" y="406" font-size="20" text-anchor="middle" font-weight="bold">Вывод не разбирается</text>
<text x="450" y="434" font-size="19" text-anchor="middle">SFT, промпт, декодирование или штраф за формат</text>
<rect x="40" y="463" width="820" height="71" rx="7" fill="#edf3f7" stroke="#666"/>
<text x="450" y="490" font-size="20" text-anchor="middle" font-weight="bold">Нет успешных попыток</text>
<text x="450" y="518" font-size="19" text-anchor="middle">Проверить знания, среду, поиск и частичный прогресс</text>
<rect x="40" y="547" width="820" height="71" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="450" y="574" font-size="20" text-anchor="middle" font-weight="bold">Есть различимые траектории</text>
<text x="450" y="602" font-size="19" text-anchor="middle">Сравнить RL с более простыми способами улучшения</text>
<text x="450" y="682" font-size="19" text-anchor="middle">Неразбираемый ответ может получать ноль или штраф — не обязательно NaN.</text>
<text x="450" y="719" font-size="19" text-anchor="middle">SFT перед RL полезно во многих постановках, но не является общим требованием.</text>
<text x="450" y="756" font-size="19" text-anchor="middle">Формат и награда не заменяют проверку качества, безопасности и переноса.</text>
</g></svg>
