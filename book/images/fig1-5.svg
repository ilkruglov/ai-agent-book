<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 129 826 1054.5" width="826" height="1054.5" style="background:#ffffff">
<title>Рис. 1-5. Архитектура «модель как AI-агент»: нативные вызовы инструментов</title>
<desc>LLM через серверную обвязку циклически вызывает нативные инструменты, включая web_search и code_interpreter. Пользовательский ввод и итоговый вывод находятся вне серверного цикла ReAct, состоящего из размышления, действия и наблюдения. «Клиенту не нужно вручную реализовывать цикл ReAct» верно только для Responses API (эксперимент 1-3). В Kimi K3 (эксперимент 1-2) инструменты выполняются на сервере, но циклом управляет клиентский код.</desc>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333333"/></marker><marker id="ah-light" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#999999"/></marker></defs>

























































