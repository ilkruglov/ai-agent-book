<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780"><title>Карта комнат и полное марковское состояние</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs><rect width="900" height="780" fill="white"/><g font-family="Arial, sans-serif" fill="#222">
<text x="450" y="38" font-size="25" text-anchor="middle" font-weight="bold">Карта комнат — не всё пространство состояний</text>
<rect x="40" y="200" width="200" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="140" y="242" font-size="21" text-anchor="middle" font-weight="bold">Входной холл</text>
<rect x="310" y="80" width="220" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="420" y="122" font-size="21" text-anchor="middle" font-weight="bold">Кладовая</text>
<rect x="310" y="320" width="220" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="420" y="362" font-size="21" text-anchor="middle" font-weight="bold">Северный коридор</text>
<rect x="640" y="200" width="220" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="750" y="242" font-size="21" text-anchor="middle" font-weight="bold">Комната стража</text>
<rect x="640" y="420" width="220" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="750" y="462" font-size="21" text-anchor="middle" font-weight="bold">Сокровищница</text>
<path d="M240 220 Q280 130 305 120" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<text x="210" y="141" font-size="18" text-anchor="middle">Восток; взять ключ</text>
<path d="M240 250 Q280 335 305 350" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<text x="163" y="329" font-size="18" text-anchor="middle">Север: нужен ключ</text>
<path d="M535 120 L635 221" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<text x="623" y="142" font-size="18" text-anchor="middle">Север → запад</text>
<path d="M535 350 L635 250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<text x="600" y="390" font-size="18" text-anchor="middle">Восток</text>
<path d="M865 235 H884 V455 H865" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<text x="750" y="321" font-size="18" text-anchor="middle">Победа над стражем</text>
<text x="750" y="349" font-size="18" text-anchor="middle">с серебряным мечом</text>
<text x="750" y="520" font-size="18" text-anchor="middle">Получение сокровища: +100</text>
<rect x="40" y="558" width="820" height="179" rx="7" fill="#edf3f7" stroke="#666"/>
<text x="450" y="592" font-size="25" text-anchor="middle" font-weight="bold">MDP: (S, A, P, R, γ)</text>
<text x="450" y="627" font-size="19" text-anchor="middle">S: комната + инвентарь + двери + состояние стража + прочие флаги</text>
<text x="450" y="659" font-size="19" text-anchor="middle">A: допустимые действия; P: переходы; R: вознаграждение; γ: дисконт</text>
<text x="450" y="704" font-size="22" text-anchor="middle" font-weight="bold">Пять комнат не означают пять состояний MDP.</text>
</g></svg>
