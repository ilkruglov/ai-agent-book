<svg xmlns="http://www.w3.org/2000/svg" width="916" height="999" viewBox="-18 0 916 999">
  <title>Совместимость с синхронным API и нативная асинхронность моделей</title>
  <desc>Среда выполнения поддерживает синхронные модели через состояния и очередь событий. Нативно асинхронные модели могут работать в ожидании инструментов и корректировать последующие действия с учётом обновлений пользователя.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#555"/></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:17px;font-weight:600}
      .small{font-size:15px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  
  
  
  
  
  
  
  
  
  
  
  
  
  

  
  
  
  
  
  
  
  
  
  
  
  
  

  
  
  
  
  
  
  
  
  
  
  

  
  
  
<g transform="scale(1 1.85)"><rect width="880" height="540" fill="#fff"/><rect x="20" y="20" width="840" height="145" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4"/><text x="40" y="53" class="title" transform="translate(40 53) scale(1 0.5405405405405405) translate(-40 -53)" style="font-family: Arial, sans-serif;"><tspan x="40" y="53">Совместимый подход: среда задаёт асинхронный ритм</tspan></text><rect x="40" y="75" width="230" height="60" rx="5" class="box"/><text x="155" y="100" text-anchor="middle" class="label" transform="translate(155 100) scale(1 0.5405405405405405) translate(-155 -100)" style="font-family: Arial, sans-serif;"><tspan x="155" y="100">Задача работает в фоне</tspan></text><text x="155" y="122" text-anchor="middle" class="small" transform="translate(155 122) scale(1 0.5405405405405405) translate(-155 -122)" style="font-family: Arial, sans-serif;"><tspan x="155" y="113">Явно записано «ещё не </tspan><tspan x="155" y="131">завершено»</tspan></text><path d="M270 105 H313" class="arrow"/><rect x="320" y="75" width="240" height="60" rx="5" class="box"/><text x="440" y="100" text-anchor="middle" class="label" transform="translate(440 100) scale(1 0.5405405405405405) translate(-440 -100)" style="font-family: Arial, sans-serif;"><tspan x="440" y="89.8">Среда принимает новое </tspan><tspan x="440" y="110.19999999999999">событие</tspan></text><text x="440" y="122" text-anchor="middle" class="small" transform="translate(440 122) scale(1 0.5405405405405405) translate(-440 -122)" style="font-family: Arial, sans-serif;"><tspan x="440" y="113">Выбор: очередь, прерывание </tspan><tspan x="440" y="131">или параллельная обработка</tspan></text><path d="M560 105 H603" class="arrow"/><rect x="610" y="75" width="230" height="60" rx="5" class="box"/><text x="725" y="100" text-anchor="middle" class="label" transform="translate(725 100) scale(1 0.5405405405405405) translate(-725 -100)" style="font-family: Arial, sans-serif;"><tspan x="725" y="89.8">Модель продолжает </tspan><tspan x="725" y="110.19999999999999">задачу</tspan></text><text x="725" y="122" text-anchor="middle" class="small" transform="translate(725 122) scale(1 0.5405405405405405) translate(-725 -122)" style="font-family: Arial, sans-serif;"><tspan x="725" y="113">Данные по-прежнему </tspan><tspan x="725" y="131">поступают синхронно</tspan></text><rect x="20" y="185" width="840" height="250" rx="8" fill="#fff" stroke="#444" stroke-width="2"/><text x="40" y="218" class="title" transform="translate(40 218) scale(1 0.5405405405405405) translate(-40 -218)" style="font-family: Arial, sans-serif;"><tspan x="40" y="218">Нативная асинхронность: модель понимает ожидание и изменения</tspan></text><rect x="40" y="240" width="230" height="65" rx="5" class="box"/><text x="155" y="267" text-anchor="middle" class="label" transform="translate(155 267) scale(1 0.5405405405405405) translate(-155 -267)" style="font-family: Arial, sans-serif;"><tspan x="155" y="267">Запуск долгого запроса</tspan></text><text x="155" y="290" text-anchor="middle" class="small" transform="translate(155 290) scale(1 0.5405405405405405) translate(-155 -290)" style="font-family: Arial, sans-serif;"><tspan x="155" y="281">Например: поиск места </tspan><tspan x="155" y="299">встречи</tspan></text><path d="M270 272 H313" class="arrow"/><rect x="320" y="240" width="240" height="65" rx="5" class="box"/><text x="440" y="267" text-anchor="middle" class="label" transform="translate(440 267) scale(1 0.5405405405405405) translate(-440 -267)" style="font-family: Arial, sans-serif;"><tspan x="440" y="256.8">Другая работа во время </tspan><tspan x="440" y="277.2">ожидания</tspan></text><text x="440" y="290" text-anchor="middle" class="small" transform="translate(440 290) scale(1 0.5405405405405405) translate(-440 -290)" style="font-family: Arial, sans-serif;"><tspan x="440" y="290">Например: повестка и чек-лист</tspan></text><path d="M560 272 H603" class="arrow"/><rect x="610" y="240" width="230" height="65" rx="5" class="box"/><text x="725" y="267" text-anchor="middle" class="label" transform="translate(725 267) scale(1 0.5405405405405405) translate(-725 -267)" style="font-family: Arial, sans-serif;"><tspan x="725" y="256.8">Решение после </tspan><tspan x="725" y="277.2">получения результата</tspan></text><text x="725" y="290" text-anchor="middle" class="small" transform="translate(725 290) scale(1 0.5405405405405405) translate(-725 -290)" style="font-family: Arial, sans-serif;"><tspan x="725" y="281">Сравнение мест по реальным </tspan><tspan x="725" y="299">данным</tspan></text><rect x="40" y="340" width="230" height="65" rx="5" class="box"/><text x="155" y="367" text-anchor="middle" class="label" transform="translate(155 367) scale(1 0.5405405405405405) translate(-155 -367)" style="font-family: Arial, sans-serif;"><tspan x="155" y="356.8">Новое требование </tspan><tspan x="155" y="377.2">пользователя</tspan></text><text x="155" y="390" text-anchor="middle" class="small" transform="translate(155 390) scale(1 0.5405405405405405) translate(-155 -390)" style="font-family: Arial, sans-serif;"><tspan x="155" y="381">Например: новый бюджет и </tspan><tspan x="155" y="399">число людей</tspan></text><path d="M270 372 H313" class="arrow"/><rect x="320" y="340" width="240" height="65" rx="5" class="box"/><text x="440" y="367" text-anchor="middle" class="label" transform="translate(440 367) scale(1 0.5405405405405405) translate(-440 -367)" style="font-family: Arial, sans-serif;"><tspan x="440" y="356.8">Сохранить готовую </tspan><tspan x="440" y="377.2">работу</tspan></text><text x="440" y="390" text-anchor="middle" class="small" transform="translate(440 390) scale(1 0.5405405405405405) translate(-440 -390)" style="font-family: Arial, sans-serif;"><tspan x="440" y="381">Включить новое требование в </tspan><tspan x="440" y="399">задачу</tspan></text><path d="M560 372 H603" class="arrow"/><rect x="610" y="340" width="230" height="65" rx="5" class="box"/><text x="725" y="367" text-anchor="middle" class="label" transform="translate(725 367) scale(1 0.5405405405405405) translate(-725 -367)" style="font-family: Arial, sans-serif;"><tspan x="725" y="356.8">Скорректировать </tspan><tspan x="725" y="377.2">дальнейшие действия</tspan></text><text x="725" y="390" text-anchor="middle" class="small" transform="translate(725 390) scale(1 0.5405405405405405) translate(-725 -390)" style="font-family: Arial, sans-serif;"><tspan x="725" y="381">Учесть имеющиеся данные и </tspan><tspan x="725" y="399">все изменения</tspan></text><rect x="20" y="455" width="840" height="65" rx="6" fill="#e9e9e9"/><text x="440" y="482" text-anchor="middle" class="label" transform="translate(440 482) scale(1 0.5405405405405405) translate(-440 -482)" style="font-family: Arial, sans-serif;"><tspan x="440" y="471.8">Модель понимает изменения и меняет план; среда управляет инструментами, задачами и </tspan><tspan x="440" y="492.2">событиями</tspan></text><text x="440" y="506" text-anchor="middle" class="small" transform="translate(440 506) scale(1 0.5405405405405405) translate(-440 -506)" style="font-family: Arial, sans-serif;"><tspan x="440" y="506">Нужно не только принимать асинхронные сообщения, но и верно возобновлять задачу и управлять действиями.</tspan></text></g></svg>
