<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570"><title>Компромиссы при выборе среды симуляции</title><desc>Шесть типов сред: от имитации API до реальной физической системы. Это качественное сравнение, не измерение скорости или точности.</desc><rect width="900" height="570" fill="white"/><g font-family="Arial, sans-serif" fill="#1f2937"><text x="450" y="34" text-anchor="middle" font-size="24" font-weight="bold">Реализм, стоимость и воспроизводимость среды</text><text x="450" y="66" text-anchor="middle" font-size="19">Более подробная среда обычно дороже; свойства проверяют на своей задаче.</text><rect x="20" y="94" width="275" height="175" rx="9" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/><text x="157.5" y="130" text-anchor="middle" font-size="23" font-weight="bold">Mock API</text><text x="157.5" y="171" text-anchor="middle" font-size="18">Имитация отдельных ответов</text><text x="157.5" y="201" text-anchor="middle" font-size="18">Дешёвые массовые прогоны</text><text x="157.5" y="231" text-anchor="middle" font-size="18">Не проверяет реальную среду</text><rect x="315" y="94" width="275" height="175" rx="9" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/><text x="452.5" y="130" text-anchor="middle" font-size="23" font-weight="bold">AWorld</text><text x="452.5" y="171" text-anchor="middle" font-size="18">Оркестрация инструментов</text><text x="452.5" y="201" text-anchor="middle" font-size="18">Параллельные запуски</text><text x="452.5" y="231" text-anchor="middle" font-size="18">Изоляцию настраивают явно</text><rect x="610" y="94" width="275" height="175" rx="9" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/><text x="747.5" y="130" text-anchor="middle" font-size="23" font-weight="bold">AndroidWorld</text><text x="747.5" y="171" text-anchor="middle" font-size="18">Эмулятор Android</text><text x="747.5" y="201" text-anchor="middle" font-size="18">Реальные приложения</text><text x="747.5" y="231" text-anchor="middle" font-size="18">Проверяемое состояние</text><rect x="20" y="294" width="275" height="175" rx="9" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/><text x="157.5" y="330" text-anchor="middle" font-size="23" font-weight="bold">Isaac Gym</text><text x="157.5" y="371" text-anchor="middle" font-size="18">Физическая симуляция</text><text x="157.5" y="401" text-anchor="middle" font-size="18">Параллельная работа на GPU</text><text x="157.5" y="431" text-anchor="middle" font-size="18">Параметры требуют проверки</text><rect x="315" y="294" width="275" height="175" rx="9" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/><text x="452.5" y="330" text-anchor="middle" font-size="23" font-weight="bold">RoboTwin2</text><text x="452.5" y="371" text-anchor="middle" font-size="18">Задачи манипулирования</text><text x="452.5" y="401" text-anchor="middle" font-size="18">Рандомизация сцены</text><text x="452.5" y="431" text-anchor="middle" font-size="18">Физика и контактные модели</text><rect x="610" y="294" width="275" height="175" rx="9" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/><text x="747.5" y="330" text-anchor="middle" font-size="23" font-weight="bold">Реальный мир</text><text x="747.5" y="371" text-anchor="middle" font-size="18">Физическая система</text><text x="747.5" y="401" text-anchor="middle" font-size="18">Дороже и труднее повторять</text><text x="747.5" y="431" text-anchor="middle" font-size="18">Сброс не всегда возможен</text><text x="450" y="522" text-anchor="middle" font-size="19">Число запусков, задержка и перенос в реальность зависят от конфигурации.</text><text x="450" y="550" text-anchor="middle" font-size="19">Расположение блоков условное: это не количественная шкала качества.</text></g></svg>
