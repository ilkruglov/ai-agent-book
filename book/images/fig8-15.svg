<svg xmlns="http://www.w3.org/2000/svg" width="900" height="865" viewBox="0 0 900 865" style="background:#fff"><title>Иллюстрация распределения заслуг</title><desc>Редакторская схема с естественной шириной кириллических надписей.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475467"/></marker></defs><g font-family="Arial, sans-serif" fill="#1d2939">
<text x="30" y="42" font-size="27" font-weight="bold">Распределение заслуг в траектории</text>
<text x="30" y="76" font-size="19">Иллюстративный пример; значения наград не взяты из эксперимента.</text>
<rect x="70" y="100" width="780" height="57" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="88" y="136" font-size="22" font-weight="bold">1</text>
<text x="135" y="136" font-size="20">Посмотреть вперёд; повернуть налево</text>
<text x="770" y="136" font-size="22" font-weight="bold">+1</text>
<path d="M460 159 L460 172" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<rect x="70" y="175" width="780" height="57" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="88" y="211" font-size="22" font-weight="bold">2</text>
<text x="135" y="211" font-size="20">Распознать знак; подтвердить направление</text>
<text x="770" y="211" font-size="22" font-weight="bold">+1</text>
<path d="M460 234 L460 247" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<rect x="70" y="250" width="780" height="57" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="88" y="286" font-size="22" font-weight="bold">3</text>
<text x="135" y="286" font-size="20">Пропустить перекрёсток; продолжить прямо</text>
<text x="770" y="286" font-size="22" font-weight="bold">−1</text>
<path d="M460 309 L460 322" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<rect x="70" y="325" width="780" height="57" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="88" y="361" font-size="22" font-weight="bold">4</text>
<text x="135" y="361" font-size="20">Обнаружить ошибку; вернуться</text>
<text x="770" y="361" font-size="22" font-weight="bold">0</text>
<path d="M460 384 L460 397" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a)"/>
<rect x="70" y="400" width="780" height="57" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="88" y="436" font-size="22" font-weight="bold">5</text>
<text x="135" y="436" font-size="20">Достичь цели; завершить задачу</text>
<text x="770" y="436" font-size="22" font-weight="bold">+10</text>
<rect x="30" y="500" width="840" height="115" rx="10" fill="#f5f6f8" stroke="#667085" stroke-width="1.5"/>
<text x="50" y="535" font-size="23" font-weight="bold">Какой вклад внёс каждый шаг?</text>
<text x="50" y="570" font-size="20">Успех после исправления не доказывает, что шаг 4 важнее шагов 1–2.</text>
<text x="50" y="601" font-size="20">Награда — обучающий сигнал, а не готовая причинная оценка действия.</text>
<text x="30" y="659" font-size="22" font-weight="bold">Промежуточное вознаграждение</text>
<text x="30" y="690" font-size="20">Даёт более частую обратную связь, но неверный критерий может вести</text>
<text x="30" y="720" font-size="20">к оптимизации промежуточных показателей вместо конечной цели.</text>
<text x="30" y="768" font-size="22" font-weight="bold">Итоговое вознаграждение</text>
<text x="30" y="799" font-size="20">Непосредственно оценивает результат. При редких успехах сложнее</text>
<text x="30" y="829" font-size="20">получить полезный обучающий сигнал и определить вклад ранних шагов.</text>
</g></svg>
