span x="746" y="184">Текущее состояние</tspan></text><text class="sans note" x="746" y="207" text-anchor="middle" dominant-baseline="middle" transform="translate(746 207) scale(1 0.5263157894736842) translate(-746 -207)" style="font-family: Arial, sans-serif;"><tspan x="746" y="198.9">Новое состояние после </tspan><tspan x="746" y="215.1">действия</tspan></text><line x1="650" y1="247" x2="842" y2="247" stroke="#b0b0b0"/><text class="sans body" x="670" y="274" dominant-baseline="middle" transform="translate(670 274) scale(1 0.5263157894736842) translate(-670 -274)" style="font-family: Arial, sans-serif;"><tspan x="670" y="265">Файловая система · база </tspan><tspan x="670" y="283">данных</tspan></text><text class="sans body" x="670" y="304" dominant-baseline="middle" transform="translate(670 304) scale(1 0.5263157894736842) translate(-670 -304)" style="font-family: Arial, sans-serif;"><tspan x="670" y="304">Веб · API · приложения</tspan></text><text class="sans body" x="670" y="334" dominant-baseline="middle" transform="translate(670 334) scale(1 0.5263157894736842) translate(-670 -334)" style="font-family: Arial, sans-serif;"><tspan x="670" y="325">Пользователь · другие </tspan><tspan x="670" y="343">AI-агенты</tspan></text><text class="sans body" x="670" y="364" dominant-baseline="middle" transform="translate(670 364) scale(1 0.5263157894736842) translate(-670 -364)" style="font-family: Arial, sans-serif;"><tspan x="670" y="355">Симуляция или </tspan><tspan x="670" y="373">физический мир</tspan></text><path class="flow" d="M 620 145 H 398"/><rect x="477" y="119" width="116" height="22" rx="4" fill="#ffffff"/><text class="sans body" x="535" y="131" text-anchor="middle" dominant-baseline="middle" transform="translate(535 131) scale(1 0.5263157894736842) translate(-535 -131)" style="font-family: Arial, sans-serif;"><tspan x="535" y="131">Наблюдение</tspan></text><path class="flow" d="M 398 341 H 617"/><rect x="477" y="311" width="116" height="22" rx="4" fill="#ffffff"/><text class="sans body" x="535" y="323" text-anchor="middle" dominant-baseline="middle" transform="translate(535 323) scale(1 0.5263157894736842) translate(-535 -323)" style="font-family: Arial, sans-serif;"><tspan x="535" y="323">Действие</tspan></text></g></svg>
