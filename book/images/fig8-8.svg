<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670"><title>Авторегрессионное предобучение: вероятность следующего токена</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs><rect width="900" height="670" fill="white"/><g font-family="Arial, sans-serif" fill="#222">
<text x="450" y="40" font-size="26" text-anchor="middle" font-weight="bold">Предобучение: предсказать следующий токен</text>
<text x="450" y="83" font-size="18" text-anchor="middle">Условная иллюстрация — реальный токенизатор может делить слова иначе.</text>
<rect x="160" y="113" width="130" height="64" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="225" y="153" font-size="24" text-anchor="middle">Кошка</text>
<rect x="310" y="113" width="130" height="64" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="375" y="153" font-size="24" text-anchor="middle">сидит</text>
<rect x="460" y="113" width="130" height="64" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="525" y="153" font-size="24" text-anchor="middle">на</text>
<rect x="610" y="113" width="130" height="64" rx="7" fill="#edf3f7" stroke="#666"/>
<text x="675" y="153" font-size="24" text-anchor="middle">…</text>
<path d="M675 182 V222" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<rect x="145" y="235" width="610" height="228" rx="7" fill="#edf3f7" stroke="#666"/>
<text x="450" y="270" font-size="23" text-anchor="middle" font-weight="bold">P(xₜ | x₁, …, xₜ₋₁): условный пример</text>
<text x="275" y="312" font-size="20" text-anchor="middle">«ковре»</text>
<rect x="355" y="292" width="252" height="25" fill="#aabccc"/><text x="660" y="312" font-size="20" text-anchor="middle">42%</text>
<text x="275" y="349" font-size="20" text-anchor="middle">«стуле»</text>
<rect x="355" y="329" width="168" height="25" fill="#aabccc"/><text x="660" y="349" font-size="20" text-anchor="middle">28%</text>
<text x="275" y="386" font-size="20" text-anchor="middle">«окне»</text>
<rect x="355" y="366" width="90" height="25" fill="#aabccc"/><text x="660" y="386" font-size="20" text-anchor="middle">15%</text>
<text x="275" y="423" font-size="20" text-anchor="middle">другие</text>
<rect x="355" y="403" width="90" height="25" fill="#aabccc"/><text x="660" y="423" font-size="20" text-anchor="middle">15%</text>
<text x="450" y="516" font-size="25" text-anchor="middle" font-weight="bold">Потери: L = −Σₜ log P(xₜ | x₁, …, xₜ₋₁)</text>
<text x="450" y="559" font-size="21" text-anchor="middle">Обучение повышает вероятность целевых токенов корпуса.</text>
<text x="450" y="601" font-size="19" text-anchor="middle">На больших корпусах модель осваивает языковые закономерности</text>
<text x="450" y="633" font-size="19" text-anchor="middle">и представления, полезные для последующего обучения.</text>
</g></svg>
