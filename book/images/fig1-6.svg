<g transform="scale(1 1.8)"><rect width="820" height="470" fill="#ffffff"/><rect class="box" x="45" y="70" width="210" height="96" rx="8" fill="#e8e8e8"/><text class="sans heading" x="60" y="95" dominant-baseline="middle" transform="translate(60 95) scale(1 0.5555555555555556) translate(-60 -95)" style="font-family: Arial, sans-serif;"><tspan x="60" y="85.4">① Рассуждение </tspan><tspan x="60" y="104.60000000000001">(Reasoning)</tspan></text><rect x="60" y="112" width="180" height="38" rx="5" fill="#ffffff" stroke="#777777"/><text class="code body" x="150" y="132" text-anchor="middle" dominant-baseline="middle" transform="translate(150 132) scale(1 0.5555555555555556) translate(-150 -132)" style="font-family: Arial, sans-serif;"><tspan x="150" y="123">«Нужно больше </tspan><tspan x="150" y="141">данных»</tspan></text><rect class="box" x="305" y="70" width="210" height="96" rx="8" fill="#f0f0f0"/><text class="sans heading" x="320" y="95" dominant-baseline="middle" transform="translate(320 95) scale(1 0.5555555555555556) translate(-320 -95)" style="font-family: Arial, sans-serif;"><tspan x="320" y="95">② Действие (Acting)</tspan></text><rect x="320" y="112" width="180" height="38" rx="5" fill="#ffffff" stroke="#777777"/><text class="code body" x="410" y="132" text-anchor="middle" dominant-baseline="middle" transform="translate(410 132) scale(1 0.5555555555555556) translate(-410 -132)" style="font-family: Arial, sans-serif;"><tspan x="410" y="132">web_search(...)</tspan></text><rect class="box" x="565" y="70" width="210" height="96" rx="8" fill="#f0f0f0"/><text class="sans heading" x="580" y="95" dominant-baseline="middle" transform="translate(580 95) scale(1 0.5555555555555556) translate(-580 -95)" style="font-family: Arial, sans-serif;"><tspan x="580" y="85.4">③ Наблюдение </tspan><tspan x="580" y="104.60000000000001">(Observing)</tspan></text><rect x="580" y="112" width="180" height="38" rx="5" fill="#ffffff" stroke="#777777"/><text class="code body" x="670" y="132" text-anchor="middle" dominant-baseline="middle" transform="translate(670 132) scale(1 0.5555555555555556) translate(-670 -132)" style="font-family: Arial, sans-serif;"><tspan x="670" y="132">tool_result: "..."</tspan></text><line class="flow" x1="255" y1="118" x2="302" y2="118"/><line class="flow" x1="515" y1="118" x2="562" y2="118"/><line class="flow" x1="670" y1="166" x2="670" y2="207"/><rect x="45" y="220" width="430" height="145" rx="8" fill="#ffffff" stroke="#777777" stroke-width="2" stroke-dasharray="7 4"/><text class="sans heading" x="65" y="244" dominant-baseline="middle" transform="translate(65 244) scale(1 0.5555555555555556) translate(-65 -244)" style="font-family: Arial, sans-serif;"><tspan x="65" y="244">Условия выхода (любое)</tspan></text><line x1="65" y1="258" x2="455" y2="258" stroke="#cccccc"/><text class="sans body" x="65" y="282" dominant-baseline="middle" transform="translate(65 282) scale(1 0.5555555555555556) translate(-65 -282)" style="font-family: Arial, sans-serif;"><tspan x="65" y="282">① Задача выполнена</tspan></text><text class="sans body" x="250" y="282" dominant-baseline="middle" transform="translate(250 282) scale(1 0.5555555555555556) translate(-250 -282)" style="font-family: Arial, sans-serif;"><tspan x="250" y="282">② Вызван final_answer</tspan></text><text class="sans body" x="65" y="314" dominant-baseline="middle" transform="translate(65 314) scale(1 0.5555555555555556) translate(-65 -314)" style="font-family: Arial, sans-serif;"><tspan x="65" y="305">③ Ответ без вызова </tspan><tspan x="65" y="323">инструмента</tspan></text><text class="sans body" x="250" y="314" dominant-baseline="middle" transform="translate(250 314) scale(1 0.5555555555555556) translate(-250 -314)" style="font-family: Arial, sans-serif;"><tspan x="250" y="314">④ Превышен лимит ошибок</tspan></text><text class="sans body" x="65" y="346" dominant-baseline="middle" transform="translate(65 346) scale(1 0.5555555555555556) translate(-65 -346)" style="font-family: Arial, sans-serif;"><tspan x="65" y="346">⑤ Достигнут максимум циклов</tspan></text><path d="M 475 260 H 587" fill="none" stroke="#777777" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-light)"/><rect x="488" y="238" width="90" height="20" rx="3" fill="#ffffff"/><text class="sans note" x="533" y="248" text-anchor="middle" dominant-baseline="middle" transform="translate(533 248) scale(1 0.5555555555555556) translate(-533 -248)" style="font-family: Arial, sans-serif;"><tspan x="533" y="248">Проверка</tspan></text><polygon class="box" points="670,208 750,260 670,312 590,260" fill="#e2e2e2"/><text class="sans heading" x="670" y="252" text-anchor="middle" dominant-baseline="middle" transform="translate(670 252) scale(1 0.5555555555555556) translate(-670 -252)" style="font-family: Arial, sans-serif;"><tspan x="670" y="242.4">Условие </tspan><tspan x="670" y="261.6">выхода</tspan></text><text class="sans heading" x="670" y="273" text-anchor="middle" dominant-baseline="middle" transform="translate(670 273) scale(1 0.5555555555555556) translate(-670 -273)" style="font-family: Arial, sans-serif;"><tspan x="670" y="273">выполнено?</tspan></text><path class="flow" d="M 750 260 H 795 V 35 H 150 V 67"/><text class="sans note" x="765" y="245" dominant-baseline="middle" transform="translate(765 245) scale(1 0.5555555555555556) translate(-765 -245)" style="font-family: Arial, sans-serif;"><tspan x="765" y="245">Нет</tspan></text><rect x="360" y="43" width="120" height="22" rx="3" fill="#ffffff"/><text class="sans note" x="420" y="54" text-anchor="middle" dominant-baseline="middle" transform="translate(420 54) scale(1 0.5555555555555556) translate(-420 -54)" style="font-family: Arial, sans-serif;"><tspan x="420" y="45.6">Следующий </tspan><tspan x="420" y="62.400000000000006">цикл</tspan></text><line class="flow" x1="670" y1="312" x2="670" y2="379"/><text class="sans note" x="685" y="346" dominant-baseline="middle" transform="translate(685 346) scale(1 0.5555555555555556) translate(-685 -346)" style="font-family: Arial, sans-serif;"><tspan x="685" y="346">Да</tspan></text><rect class="box" x="555" y="382" width="230" height="68" rx="8" fill="#d6d6d6"/><text class="sans heading" x="670" y="416" text-anchor="middle" dominant-baseline="middle" transform="translate(670 416) scale(1 0.5555555555555556) translate(-670 -416)" style="font-family: Arial, sans-serif;"><tspan x="670" y="416">Вывод результата</tspan></text></g></svg>
