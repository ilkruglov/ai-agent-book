<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800"><title>SFT: демонстрации, целевые потери и независимая оценка</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs><rect width="900" height="800" fill="white"/><g font-family="Arial, sans-serif" fill="#222">
<text x="450" y="40" font-size="26" text-anchor="middle" font-weight="bold">SFT: обучение на демонстрациях</text>
<rect x="30" y="85" width="260" height="165" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="160" y="122" font-size="23" text-anchor="middle" font-weight="bold">Данные</text>
<text x="160" y="164" font-size="18" text-anchor="middle">Пары «вход — ответ»</text>
<text x="160" y="193" font-size="18" text-anchor="middle">и проверенные траектории</text>
<text x="160" y="222" font-size="18" text-anchor="middle">Человек или модель-учитель</text>
<path d="M295 163 H319" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<rect x="325" y="85" width="260" height="165" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="455" y="122" font-size="23" text-anchor="middle" font-weight="bold">Оптимизация</text>
<text x="455" y="164" font-size="18" text-anchor="middle">L = −Σ log P(yᵢ | xᵢ)</text>
<text x="455" y="193" font-size="18" text-anchor="middle">Часто loss только по ответу</text>
<text x="455" y="222" font-size="18" text-anchor="middle">Маска зависит от постановки</text>
<path d="M590 163 H614" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<rect x="620" y="85" width="260" height="165" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="750" y="122" font-size="23" text-anchor="middle" font-weight="bold">Оценка</text>
<text x="750" y="164" font-size="18" text-anchor="middle">Формат и выполнение задачи</text>
<text x="750" y="193" font-size="18" text-anchor="middle">Сохранение других навыков</text>
<text x="750" y="222" font-size="18" text-anchor="middle">Перенос на новые данные</text>
<text x="450" y="299" font-size="23" text-anchor="middle" font-weight="bold">Примеры обучаемого поведения</text>
<rect x="40" y="330" width="390" height="132" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="235" y="366" font-size="22" text-anchor="middle" font-weight="bold">Речь</text>
<text x="235" y="406" font-size="19" text-anchor="middle">Текст, референсное аудио,</text>
<text x="235" y="434" font-size="19" text-anchor="middle">стиль и поддерживаемые теги</text>
<rect x="470" y="330" width="390" height="132" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="665" y="366" font-size="22" text-anchor="middle" font-weight="bold">Многоязычные ответы</text>
<text x="665" y="406" font-size="19" text-anchor="middle">Примеры на целевых языках</text>
<text x="665" y="434" font-size="19" text-anchor="middle">и проверка межъязыкового переноса</text>
<rect x="40" y="486" width="390" height="132" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="235" y="522" font-size="22" text-anchor="middle" font-weight="bold">Дистилляция промпта</text>
<text x="235" y="562" font-size="19" text-anchor="middle">Поведение с длинной инструкцией</text>
<text x="235" y="590" font-size="19" text-anchor="middle">переносится в обучающие ответы</text>
<rect x="470" y="486" width="390" height="132" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="665" y="522" font-size="22" text-anchor="middle" font-weight="bold">Вызовы инструментов</text>
<text x="665" y="562" font-size="19" text-anchor="middle">Параметры, схемы вызовов</text>
<text x="665" y="590" font-size="19" text-anchor="middle">и реакция на ошибки</text>
<text x="450" y="684" font-size="22" text-anchor="middle" font-weight="bold">SFT может обучать формату, фактам и поведению.</text>
<text x="450" y="727" font-size="21" text-anchor="middle">Способность к обобщению проверяют экспериментально:</text>
<text x="450" y="760" font-size="21" text-anchor="middle">она не исключается самим методом SFT.</text>
</g></svg>
