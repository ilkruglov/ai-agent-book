<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750">
<title>Табличный Q-learning и LLM-агент: разные исходные знания</title>
<desc>Сравнение представлений состояния и выбора действий в игре. В описанном запуске Kimi K3 завершил игру за 18 шагов; одна попытка не определяет вероятность успеха.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs>
<rect width="900" height="750" fill="white"/>
<g font-family="Arial, sans-serif" fill="#222">
<text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold">Q-learning и LLM-агент в одной игре</text>
<text x="240" y="82" text-anchor="middle" font-size="22" font-weight="bold">Табличный Q-learning</text>
<text x="660" y="82" text-anchor="middle" font-size="22" font-weight="bold">LLM-агент: Kimi K3</text>
<rect x="45" y="105" width="390" height="84" rx="8" fill="#f5f5f5" stroke="#666"/>
<text x="240" y="130" text-anchor="middle" font-size="20" font-weight="bold">Код состояния</text>
<text x="240" y="154" text-anchor="middle" font-size="19">Комната, предметы, двери</text>
<text x="240" y="177" text-anchor="middle" font-size="19">кодируются как ключ таблицы</text>
<path d="M240 191 V206" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="209" width="390" height="84" rx="8" fill="#f5f5f5" stroke="#666"/>
<text x="240" y="234" text-anchor="middle" font-size="20" font-weight="bold">Оценки Q(s, a)</text>
<text x="240" y="258" text-anchor="middle" font-size="19">Таблица ценности действий</text>
<text x="240" y="281" text-anchor="middle" font-size="19">обновляется по опыту</text>
<path d="M240 295 V310" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="313" width="390" height="84" rx="8" fill="#f5f5f5" stroke="#666"/>
<text x="240" y="338" text-anchor="middle" font-size="20" font-weight="bold">Выбор действия при ε = 0,1</text>
<text x="240" y="362" text-anchor="middle" font-size="19">90% — максимум текущего Q</text>
<text x="240" y="385" text-anchor="middle" font-size="19">10% — случайное действие</text>
<path d="M240 399 V414" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="417" width="390" height="84" rx="8" fill="#f5f5f5" stroke="#666"/>
<text x="240" y="442" text-anchor="middle" font-size="20" font-weight="bold">Команда среды</text>
<text x="240" y="466" text-anchor="middle" font-size="19">Выбранный индекс действия</text>
<text x="240" y="489" text-anchor="middle" font-size="19">преобразуется в команду</text>
<rect x="465" y="105" width="390" height="84" rx="8" fill="#f5f5f5" stroke="#666"/>
<text x="660" y="130" text-anchor="middle" font-size="20" font-weight="bold">Текстовое наблюдение</text>
<text x="660" y="154" text-anchor="middle" font-size="19">Описание комнаты, предметов</text>
<text x="660" y="177" text-anchor="middle" font-size="19">и доступных действий</text>
<path d="M660 191 V206" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="465" y="209" width="390" height="84" rx="8" fill="#f5f5f5" stroke="#666"/>
<text x="660" y="234" text-anchor="middle" font-size="20" font-weight="bold">Рассуждение и опыт</text>
<text x="660" y="258" text-anchor="middle" font-size="19">Предобученные знания</text>
<text x="660" y="281" text-anchor="middle" font-size="19">и буфер до 50 записей</text>
<path d="M660 295 V310" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="465" y="313" width="390" height="84" rx="8" fill="#f5f5f5" stroke="#666"/>
<text x="660" y="338" text-anchor="middle" font-size="20" font-weight="bold">Выбор действия</text>
<text x="660" y="362" text-anchor="middle" font-size="19">Модель использует контекст</text>
<text x="660" y="385" text-anchor="middle" font-size="19">и обратную связь среды</text>
<path d="M660 399 V414" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="465" y="417" width="390" height="84" rx="8" fill="#f5f5f5" stroke="#666"/>
<text x="660" y="442" text-anchor="middle" font-size="20" font-weight="bold">Команда среды</text>
<text x="660" y="466" text-anchor="middle" font-size="19">Структурированный вызов</text>
<text x="660" y="489" text-anchor="middle" font-size="19">например: взять красный ключ</text>
<rect x="45" y="542" width="810" height="166" rx="8" fill="#edf3f7" stroke="#667788"/>
<text x="450" y="573" text-anchor="middle" font-size="22" font-weight="bold">Что показывает описанный запуск</text>
<text x="450" y="607" text-anchor="middle" font-size="21">LLM-агент завершил первую попытку за 18 шагов.</text>
<text x="450" y="638" text-anchor="middle" font-size="19">Это результат одной траектории, а не оценка доли успеха.</text>
<text x="450" y="669" text-anchor="middle" font-size="19">Сравнение включает различия в предобучении и представлении.</text>
<text x="450" y="695" text-anchor="middle" font-size="19">Оно не изолирует преимущество одного алгоритма RL.</text>
</g></svg>
