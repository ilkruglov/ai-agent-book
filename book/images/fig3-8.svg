<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 58 800 486.35003662109375" width="800" height="486.35003662109375" style="background:#ffffff">
<defs><marker id="ah" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333333"/></marker><marker id="ah-light" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#999999"/></marker></defs>




























<g transform="scale(1 1.45)"><rect x="40" y="50" width="720" height="50" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><text x="60" y="75" font-family="'Courier New', Courier, monospace" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" transform="translate(60 75) scale(1 0.6896551724137931) translate(-60 -75)" style="font-family: Arial, sans-serif;"><tspan x="60" y="75">Score(Q,D) = Σ IDF(qi) × TF(qi,D)×(k1+1) / (TF + k1×(1-b+b×|D|/avgdl))</tspan></text><rect x="40" y="120" width="220" height="170" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/><text x="150" y="148" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" transform="translate(150 148) scale(1 0.6896551724137931) translate(-150 -148)" style="font-family: Arial, sans-serif;"><tspan x="150" y="124">Насыщение </tspan><tspan x="150" y="148">частоты термина </tspan><tspan x="150" y="172">(TF)</tspan></text><line x1="60" y1="163" x2="240" y2="163" stroke="#999999" stroke-width="2"/><text x="150" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(150 190) scale(1 0.6896551724137931) translate(-150 -190)" style="font-family: Arial, sans-serif;"><tspan x="150" y="180.4">k₁ управляет скоростью </tspan><tspan x="150" y="199.6">насыщения</tspan></text><text x="150" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(150 218) scale(1 0.6896551724137931) translate(-150 -218)" style="font-family: Arial, sans-serif;"><tspan x="150" y="208.4">Частота термина ↑, но </tspan><tspan x="150" y="227.6">прирост вклада снижается</tspan></text><text x="150" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(150 246) scale(1 0.6896551724137931) translate(-150 -246)" style="font-family: Arial, sans-serif;"><tspan x="150" y="236.4">Число вхождений </tspan><tspan x="150" y="255.6">удваивается</tspan></text><text x="150" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(150 274) scale(1 0.6896551724137931) translate(-150 -274)" style="font-family: Arial, sans-serif;"><tspan x="150" y="264.4">Оценка не удваивается </tspan><tspan x="150" y="283.59999999999997">линейно</tspan></text><rect x="290" y="120" width="220" height="170" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/><text x="400" y="148" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" transform="translate(400 148) scale(1 0.6896551724137931) translate(-400 -148)" style="font-family: Arial, sans-serif;"><tspan x="400" y="124">Обратная </tspan><tspan x="400" y="148">документная </tspan><tspan x="400" y="172">частота (IDF)</tspan></text><line x1="310" y1="163" x2="490" y2="163" stroke="#999999" stroke-width="2"/><text x="400" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(400 190) scale(1 0.6896551724137931) translate(-400 -190)" style="font-family: Arial, sans-serif;"><tspan x="400" y="180.4">Оценивает редкость </tspan><tspan x="400" y="199.6">термина</tspan></text><text x="400" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(400 218) scale(1 0.6896551724137931) translate(-400 -218)" style="font-family: Arial, sans-serif;"><tspan x="400" y="218">«частица» → IDF ≈ 0</tspan></text><text x="400" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(400 246) scale(1 0.6896551724137931) translate(-400 -246)" style="font-family: Arial, sans-serif;"><tspan x="400" y="236.4">«назначение наказания» </tspan><tspan x="400" y="255.6">→ IDF ≈ 5,2</tspan></text><text x="400" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(400 274) scale(1 0.6896551724137931) translate(-400 -274)" style="font-family: Arial, sans-serif;"><tspan x="400" y="274">Вес редких слов &gt;&gt; частых</tspan></text><rect x="540" y="120" width="220" height="170" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/><text x="650" y="148" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" transform="translate(650 148) scale(1 0.6896551724137931) translate(-650 -148)" style="font-family: Arial, sans-serif;"><tspan x="650" y="136">Нормализация </tspan><tspan x="650" y="160">длины (b)</tspan></text><line x1="560" y1="163" x2="740" y2="163" stroke="#999999" stroke-width="2"/><text x="650" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(650 190) scale(1 0.6896551724137931) translate(-650 -190)" style="font-family: Arial, sans-serif;"><tspan x="650" y="180.4">b ∈ [0,1] — степень </tspan><tspan x="650" y="199.6">нормализации</tspan></text><text x="650" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(650 218) scale(1 0.6896551724137931) translate(-650 -218)" style="font-family: Arial, sans-serif;"><tspan x="650" y="218">b=0: длина не учитывается</tspan></text><text x="650" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(650 246) scale(1 0.6896551724137931) translate(-650 -246)" style="font-family: Arial, sans-serif;"><tspan x="650" y="246">b=1: полная нормализация</tspan></text><text x="650" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" transform="translate(650 274) scale(1 0.6896551724137931) translate(-650 -274)" style="font-family: Arial, sans-serif;"><tspan x="650" y="264.4">Устраняет перекос к </tspan><tspan x="650" y="283.59999999999997">длинным документам</tspan></text><line x1="150" y1="290" x2="150" y2="315" stroke="#999999" stroke-width="2"/><line x1="400" y1="290" x2="400" y2="315" stroke="#999999" stroke-width="2"/><line x1="650" y1="290" x2="650" y2="315" stroke="#999999" stroke-width="2"/><rect x="40" y="315" width="720" height="48" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/><text x="400.0" y="339" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" transform="translate(400 339) scale(1 0.6896551724137931) translate(-400 -339)" style="font-family: Arial, sans-serif;"><tspan x="400" y="339">Итоговая оценка = Σ [IDF × насыщенный TF с нормализацией длины]</tspan></text></g></svg>
