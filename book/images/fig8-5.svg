<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><title>Сравнение табличного примера с агентом на основе предобученной LLM</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs><rect width="900" height="900" fill="white"/><g font-family="Arial, sans-serif" fill="#222">
<text x="450" y="37" font-size="24" text-anchor="middle" font-weight="bold">Два примера агента, а не граница возможностей RL</text>
<text x="245" y="87" font-size="22" text-anchor="middle" font-weight="bold">Табличный Q-learning</text>
<text x="660" y="87" font-size="22" text-anchor="middle" font-weight="bold">Предобученный LLM-агент</text>
<text x="450" y="126" font-size="18" text-anchor="middle" font-weight="bold">Действия</text>
<rect x="40" y="138" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<rect x="460" y="138" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="240" y="165" font-size="19" text-anchor="middle">Заранее заданные команды</text>
<text x="240" y="192" font-size="19" text-anchor="middle">игровой среды</text>
<text x="660" y="165" font-size="19" text-anchor="middle">Последовательности токенов</text>
<text x="660" y="192" font-size="19" text-anchor="middle">и вызовов инструментов</text>
<text x="450" y="238" font-size="18" text-anchor="middle" font-weight="bold">Исходные знания</text>
<rect x="40" y="250" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<rect x="460" y="250" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="240" y="277" font-size="19" text-anchor="middle">В этом примере — обучение</text>
<text x="240" y="304" font-size="19" text-anchor="middle">с нуля, по опыту игры</text>
<text x="660" y="277" font-size="19" text-anchor="middle">Языковые знания из предобучения</text>
<text x="660" y="304" font-size="19" text-anchor="middle">и текущие инструкции</text>
<text x="450" y="350" font-size="18" text-anchor="middle" font-weight="bold">Состояние</text>
<rect x="40" y="362" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<rect x="460" y="362" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="240" y="389" font-size="19" text-anchor="middle">Ключ таблицы кодирует комнату,</text>
<text x="240" y="416" font-size="19" text-anchor="middle">предметы и флаги среды</text>
<text x="660" y="389" font-size="19" text-anchor="middle">Текстовые наблюдения,</text>
<text x="660" y="416" font-size="19" text-anchor="middle">история и другие входы</text>
<text x="450" y="462" font-size="18" text-anchor="middle" font-weight="bold">Обратная связь</text>
<rect x="40" y="474" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<rect x="460" y="474" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="240" y="501" font-size="19" text-anchor="middle">Вознаграждение среды</text>
<text x="240" y="528" font-size="19" text-anchor="middle">обновляет оценки Q</text>
<text x="660" y="501" font-size="19" text-anchor="middle">Ответы инструментов — контекст;</text>
<text x="660" y="528" font-size="19" text-anchor="middle">при RL добавляется вознаграждение</text>
<text x="450" y="574" font-size="18" text-anchor="middle" font-weight="bold">Планирование</text>
<rect x="40" y="586" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<rect x="460" y="586" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="240" y="613" font-size="19" text-anchor="middle">Таблица выбирает действие</text>
<text x="240" y="640" font-size="19" text-anchor="middle">без отдельной цепочки текста</text>
<text x="660" y="613" font-size="19" text-anchor="middle">Модель может генерировать</text>
<text x="660" y="640" font-size="19" text-anchor="middle">промежуточные рассуждения</text>
<text x="450" y="686" font-size="18" text-anchor="middle" font-weight="bold">Перенос</text>
<rect x="40" y="698" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<rect x="460" y="698" width="400" height="70" rx="7" fill="#f5f5f5" stroke="#666"/>
<text x="240" y="725" font-size="19" text-anchor="middle">Таблица привязана к кодированию</text>
<text x="240" y="752" font-size="19" text-anchor="middle">состояний и действий</text>
<text x="660" y="725" font-size="19" text-anchor="middle">Перенос возможен,</text>
<text x="660" y="752" font-size="19" text-anchor="middle">но проверяется на новых задачах</text>
<text x="450" y="813" font-size="20" text-anchor="middle">MDP допускает и непрерывные пространства, а RL — модели среды,</text>
<text x="450" y="844" font-size="20" text-anchor="middle">планирование, аппроксимацию функций и перенос знаний.</text>
<text x="450" y="877" font-size="19" text-anchor="middle">Конечный словарь LLM даёт огромное число составных последовательностей.</text>
</g></svg>
