<g transform="scale(1 2.15)"><line x1="40" y1="26" x2="846" y2="26" stroke="#333333" stroke-width="2" marker-end="url(#ax)"/><text class="t a" x="130" y="12" transform="translate(130 12) scale(1 0.46511627906976744) translate(-130 -12)" style="font-family: Arial, sans-serif;"><tspan x="130" y="3.9000000000000004">Автоматическая проверяемость </tspan><tspan x="130" y="20.1">задачи: высокая</tspan></text><text class="t a" x="790" y="12" transform="translate(790 12) scale(1 0.46511627906976744) translate(-790 -12)" style="font-family: Arial, sans-serif;"><tspan x="790" y="12">Низкая</tspan></text><rect x="18" y="52" width="190" height="112" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/><text class="t h" x="113" y="76" transform="translate(113 76) scale(1 0.46511627906976744) translate(-113 -76)" style="font-family: Arial, sans-serif;"><tspan x="113" y="66.4">Детерминированный </tspan><tspan x="113" y="85.60000000000001">верификатор</tspan></text><text class="t m" x="113" y="100" transform="translate(113 100) scale(1 0.46511627906976744) translate(-113 -100)" style="font-family: Arial, sans-serif;"><tspan x="113" y="91.9">Конечное состояние </tspan><tspan x="113" y="108.10000000000001">однозначно проверяемо</tspan></text><text class="t m" x="113" y="120" transform="translate(113 120) scale(1 0.46511627906976744) translate(-113 -120)" style="font-family: Arial, sans-serif;"><tspan x="113" y="120">Пройдено / не пройдено</tspan></text><text class="t n" x="113" y="146" transform="translate(113 146) scale(1 0.46511627906976744) translate(-113 -146)" style="font-family: Arial, sans-serif;"><tspan x="113" y="146">Запуск тестов SWE-bench</tspan></text><line x1="212" y1="108" x2="232" y2="108" stroke="#666666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect x="236" y="52" width="190" height="112" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/><text class="t h" x="331" y="76" transform="translate(331 76) scale(1 0.46511627906976744) translate(-331 -76)" sty