06976744) translate(-549 -146)" style="font-family: Arial, sans-serif;"><tspan x="549" y="138.2">Качество поддержки, </tspan><tspan x="549" y="153.79999999999998">подготовка отчётов</tspan></text><line x1="648" y1="108" x2="668" y2="108" stroke="#666666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect x="672" y="52" width="190" height="112" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/><text class="t h" x="767" y="76" transform="translate(767 76) scale(1 0.46511627906976744) translate(-767 -76)" style="font-family: Arial, sans-serif;"><tspan x="767" y="76">Попарное сравнение</tspan></text><text class="t m" x="767" y="100" transform="translate(767 100) scale(1 0.46511627906976744) translate(-767 -100)" style="font-family: Arial, sans-serif;"><tspan x="767" y="91.9">Даже аспекты трудно </tspan><tspan x="767" y="108.10000000000001">сформулировать</tspan></text><text class="t m" x="767" y="120" transform="translate(767 120) scale(1 0.46511627906976744) translate(-767 -120)" style="font-family: Arial, sans-serif;"><tspan x="767" y="111.9">Только выбор лучшего: A </tspan><tspan x="767" y="128.1">или B</tspan></text><text class="t n" x="767" y="146" transform="translate(767 146) scale(1 0.46511627906976744) translate(-767 -146)" style="font-family: Arial, sans-serif;"><tspan x="767" y="146">Chatbot Arena</tspan></text><rect x="18" y="192" width="408" height="66" rx="6" fill="#f3f0e8" stroke="#333333" stroke-width="2"/><text class="t h" x="222" y="212" transform="translate(222 212) scale(1 0.46511627906976744) translate(-222 -212)" style="font-family: Arial, sans-serif;"><tspan x="222" y="212">Детерминированная проверка</tspan></text><text class="t m" x="222" y="234" transform="translate(222 234) scale(1 0.46511627906976744) translate(-222 -234)" style="font-family: Arial, sans-serif;"><tspan x="222" y="234">Полностью воспроизводима, подходит для CI, дёшева</tspan></text><text class="t m" x="222" y="250" transform="translate(222 250) scale(1 0.46511627906976744) translate(-222 -250)" style="font-family: Arial, sans-serif;"><tspan x="222" y="250">Цена: лишь верно/неверно, без локализации проблемы</tspan></text><rect x="454" y="192" width="408" height="66" rx="6" fill="#f3f0e8" stroke="#333333" stroke-width="2"/><text class="t h" x="658" y="212" transform="translate(658 212) scale(1 0.46511627906976744) translate(-658 -212)" style="font-family: Arial, sans-serif;"><tspan x="658" y="212">Оценка моделью</tspan></text><text class="t m" x="658" y="234" transform="translate(658 234) scale(1 0.46511627906976744) translate(-658 -234)" style="font-family: Arial, sans-serif;"><tspan x="658" y="225.9">Даёт диагностические аспекты для задач без формальных </tspan><tspan x="658" y="242.1">утверждений</tspan></text><text class="t m" x="658" y="250" transform="translate(658 250) scale(1 0.46511627906976744) translate(-658 -250)" style="font-family: Arial, sans-serif;"><tspan x="658" y="250">Цена: смещение и вариативность оценки, выше стоимость</tspan></text></g></svg>
