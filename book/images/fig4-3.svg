<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<title>Загрузка инструментов и повторное использование префикса</title>
<desc>Изменение раннего определения требует пересчёта с точки изменения. Добавление определения в конец истории сохраняет прежний префикс, но не гарантирует попадания в кэш.</desc>
<rect width="900" height="650" fill="white"/>
<g font-family="Arial, sans-serif" font-size="21" fill="#222">
<text x="30" y="38" font-size="25" font-weight="bold">Загрузка инструментов и KV-кэш</text>
<text x="30" y="83" font-weight="bold">Изменение раннего префикса</text>
<text x="465" y="83" font-weight="bold">Добавление в конец истории</text>
<rect x="30" y="105" width="405" height="90" rx="8" fill="#eee" stroke="#555"/>
<text x="48" y="141">Системные инструкции</text>
<text x="48" y="173">и определения инструментов</text>
<rect x="465" y="105" width="405" height="90" rx="8" fill="#e1eddf" stroke="#555"/>
<text x="483" y="141">Стабильные инструкции</text>
<text x="483" y="173">и базовые инструменты</text>
<rect x="30" y="212" width="405" height="76" rx="8" fill="#fafafa" stroke="#555"/>
<text x="48" y="244">Пользователь: узнать цену NVDA</text>
<text x="48" y="274">История вызовов и результатов</text>
<rect x="465" y="212" width="405" height="76" rx="8" fill="#fafafa" stroke="#555"/>
<text x="483" y="244">Пользователь: узнать цену NVDA</text>
<text x="483" y="274">Агент: найти нужный инструмент</text>
<rect x="30" y="306" width="405" height="108" rx="8" fill="#f3e4dc" stroke="#555"/>
<text x="48" y="338">Новое определение изменяет</text>
<text x="48" y="369">уже переданный префикс:</text>
<text x="48" y="400" font-weight="bold">пересчёт с точки изменения</text>
<rect x="465" y="306" width="405" height="108" rx="8" fill="#e1eddf" stroke="#555"/>
<text x="483" y="338">Результат поиска инструмента:</text>
<text x="483" y="369">схема get_stock_quote</text>
<text x="483" y="400" font-weight="bold">добавлена в конец истории</text>
<text x="30" y="458">Более ранняя неизменная часть</text>
<text x="30" y="490">может использоваться повторно.</text>
<text x="465" y="458">Прежний префикс сохранён;</text>
<text x="465" y="490">новое содержимое вычисляется.</text>
<line x1="30" y1="518" x2="870" y2="518" stroke="#aaa"/>
<text x="30" y="551" font-weight="bold">Сохранить префикс — не значит гарантировать попадание.</text>
<text x="30" y="583">Важны точное совпадение, TTL, минимальная длина и условия API.</text>
<text x="30" y="615">Долю кэшированных токенов и задержку нужно измерять.</text>
</g></svg>
