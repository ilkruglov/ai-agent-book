<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1080" width="780" height="1080" style="background:#fff">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#555"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#222">
<text x="390" y="30" font-size="24" font-weight="bold" text-anchor="middle">Isabella Rodriguez · кафе Hobbs</text>
<text x="390" y="57" font-size="17" text-anchor="middle">Гостеприимная владелица кафе; записи и расписание — иллюстрация</text>
<rect x="20" y="85" width="355" height="400" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="197.5" y="115" font-size="20" font-weight="bold" text-anchor="middle">Поток памяти</text>
<text x="38" y="147" font-size="16" text-anchor="start">08:30 — кафе открывается.</text>
<text x="38" y="173" font-size="16" text-anchor="start">importance: 4; recency: 0.9</text>
<text x="38" y="199" font-size="16" text-anchor="start">09:15 — Klaus заходит за кофе.</text>
<text x="38" y="225" font-size="16" text-anchor="start">importance: 5; recency: 0.85</text>
<text x="38" y="251" font-size="16" text-anchor="start">10:00 — план вечеринки.</text>
<text x="38" y="277" font-size="16" text-anchor="start">importance: 9; recency: 0.8</text>
<text x="38" y="303" font-size="16" text-anchor="start">11:30 — приглашение Maria.</text>
<text x="38" y="329" font-size="16" text-anchor="start">importance: 8; recency: 0.7</text>
<text x="38" y="355" font-size="16" text-anchor="start">14:00 — просьба помочь с залом.</text>
<text x="38" y="381" font-size="16" text-anchor="start">importance: 7; recency: 0.6</text>
<text x="38" y="407" font-size="16" text-anchor="start"></text>
<text x="38" y="433" font-size="16" text-anchor="start">Записи извлекаются по важности,</text>
<text x="38" y="459" font-size="16" text-anchor="start">свежести и релевантности.</text>
<rect x="405" y="85" width="355" height="400" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="582.5" y="115" font-size="20" font-weight="bold" text-anchor="middle">Рефлексия</text>
<text x="423" y="147" font-size="17" text-anchor="start">Кто постоянные гости?</text>
<text x="423" y="173" font-size="17" text-anchor="start">→ Maria, Klaus, Tom.</text>
<text x="423" y="199" font-size="17" text-anchor="start">Кого пригласить?</text>
<text x="423" y="225" font-size="17" text-anchor="start">→ Постоянных гостей и друзей.</text>
<text x="423" y="251" font-size="17" text-anchor="start">Как идёт подготовка?</text>
<text x="423" y="277" font-size="17" text-anchor="start">→ Часть гостей приглашена,</text>
<text x="423" y="303" font-size="17" text-anchor="start">   осталось подготовить зал.</text>
<text x="423" y="329" font-size="17" text-anchor="start">Кто поможет?</text>
<text x="423" y="355" font-size="17" text-anchor="start">→ Maria, подруга.</text>
<text x="423" y="381" font-size="17" text-anchor="start"></text>
<text x="423" y="407" font-size="17" text-anchor="start">Обобщения возвращаются</text>
<text x="423" y="433" font-size="17" text-anchor="start">в память и влияют на решения.</text>
<path d="M377 270 L403 270" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M582 488 L582 516" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="520" width="740" height="235" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="550" font-size="20" font-weight="bold" text-anchor="middle">Планирование и действия</text>
<text x="38" y="582" font-size="17" text-anchor="start">08:00 — подъём и завтрак; 09:00 — открытие кафе.</text>
<text x="38" y="608" font-size="17" text-anchor="start">12:00 — приглашение гостей во время работы.</text>
<text x="38" y="634" font-size="17" text-anchor="start">14:00 — подготовка зала с Maria; 16:00 — угощения и места.</text>
<text x="38" y="660" font-size="17" text-anchor="start">18:00 — вечеринка ко Дню святого Валентина.</text>
<text x="38" y="686" font-size="17" text-anchor="start">План корректируется по ситуации: память и новые наблюдения</text>
<text x="38" y="712" font-size="17" text-anchor="start">влияют на следующие действия.</text>
<rect x="20" y="790" width="740" height="245" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<text x="390" y="820" font-size="20" font-weight="bold" text-anchor="middle">Коллективное поведение: 25 агентов, два виртуальных дня</text>
<text x="38" y="852" font-size="17" text-anchor="start">Общение: случайные встречи и развитие отношений.</text>
<text x="38" y="878" font-size="17" text-anchor="start">Распространение приглашения Isabella через контакты.</text>
<text x="38" y="904" font-size="17" text-anchor="start">Обсуждение намерения Sam баллотироваться в мэры.</text>
<text x="38" y="930" font-size="17" text-anchor="start">Память об отношениях: продолжение тем прошлых разговоров.</text>
<text x="38" y="956" font-size="17" text-anchor="start">Сценарий каждого совместного события не прописан пошагово,</text>
<text x="38" y="982" font-size="17" text-anchor="start">но начальные цели, среда и механизмы заданы исследователями.</text>
<text x="390" y="1064" font-size="17" text-anchor="middle">Текстовая рефлексия не является доказательством самосознания.</text>
</g>
</svg>
