<text x="400" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold" textLength="77.48" lengthAdjust="spacingAndGlyphs">▸ Распространение информации</text>
