<text x="140" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="231.05" lengthAdjust="spacingAndGlyphs">AI-агенты узнают о выдвижении Sam в мэры</text>
<text x="400" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold" textLength="77.48" lengthAdjust="spacingAndGlyphs">▸ Память об отношениях</text>
<text x="490" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal" textLength="252.00" lengthAdjust="spacingAndGlyphs">Помнят прошлые беседы (например, о фотопроекте) и продолжают тему</text>
<text x="405" y="525" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" textLength="445.36" lengthAdjust="spacingAndGlyphs">Всё поведение не запрограммировано — оно возникает из памяти, рефлексии и социального здравого смысла</text>
