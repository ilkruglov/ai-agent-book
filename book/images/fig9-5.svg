<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/></marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:20px;font-weight:700}
      .s{font-size:15px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="500" y="25" text-anchor="middle" class="t h" dominant-baseline="central"><tspan x="500" y="25">Онлайн-работа и офлайн-эволюция: рабочая версия не меняется во время выполнения</tspan></text>

  <rect x="28" y="80" width="944" height="150" rx="10" fill="#fafbfb" stroke="#7d8d96" stroke-width="1.5"/>
  <text x="55" y="107" class="t h" dominant-baseline="central"><tspan x="55" y="107">Цикл онлайн-работы</tspan></text>
  <rect x="200" y="135" width="190" height="70" rx="7" class="box"/>
  <rect x="405" y="135" width="190" height="70" rx="7" class="box"/>
  <rect x="610" y="135" width="190" height="70" rx="7" class="box"/>
  <text x="295" y="170" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="295" y="160.85">Стабильная версия </tspan><tspan x="295" y="179.15">агента</tspan></text>
  <text x="500" y="170" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="500" y="160.85">Решение реальных </tspan><tspan x="500" y="179.15">задач</tspan></text>
  <text x="705" y="170" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="705" y="160.85">Запись траекторий и </tspan><tspan x="705" y="179.15">обратной связи</tspan></text>
  <path d="M390 170 H403" class="line"/><path d="M595 170 H608" class="line"/>

  <rect x="28" y="300" width="944" height="240" rx="10" fill="#f5f8fa" stroke="#2f617a" stroke-width="1.5"/>
  <text x="55" y="328" class="t h" dominant-baseline="central"><tspan x="55" y="328">Цикл офлайн-эволюции</tspan></text>
  <rect x="87" y="350" width="190" height="155" rx="7" class="accent"/>
  <rect x="297" y="350" width="190" height="155" rx="7" class="accent"/>
  <rect x="507" y="350" width="190" height="155" rx="7" class="accent"/>
  <rect x="717" y="350" width="190" height="155" rx="7" class="accent"/>
  <text x="182" y="391" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="182" y="391">Агрегация и диагностика</tspan></text><text x="182" y="453" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="182" y="443.85">Поиск общих </tspan><tspan x="182" y="462.15">первопричин</tspan></text>
  <text x="392" y="391" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="392" y="381.85">Предлагаемые </tspan><tspan x="392" y="400.15">изменения</tspan></text><text x="392" y="453" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="392" y="443.85">Знания · инструкции · </tspan><tspan x="392" y="462.15">программы · параметры</tspan></text>
  <text x="602" y="391" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="602" y="372.7">Регрессионная проверка </tspan><tspan x="602" y="391">и проверка </tspan><tspan x="602" y="409.3">безопасности</tspan></text><text x="602" y="453" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="602" y="443.85">Сохранение прежних </tspan><tspan x="602" y="462.15">возможностей</tspan></text>
  <text x="812" y="391" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="812" y="381.85">Канареечный выпуск, </tspan><tspan x="812" y="400.15">мониторинг и откат</tspan></text><text x="812" y="453" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="812" y="443.85">Продвижение в новую </tspan><tspan x="812" y="462.15">стабильную версию</tspan></text>
  <path d="M277 425 H295" class="line"/><path d="M487 425 H505" class="line"/><path d="M697 425 H715" class="line"/>

  <!-- Траектории поступают вниз в офлайн-диагностику по отдельному каналу между уровнями. -->
  <path d="M705 205 V265 H40 V425 H85" class="line" stroke-dasharray="7 5"/>
  <rect x="284" y="250" width="320" height="30" rx="4" fill="#ffffff"/>
  <text x="444" y="265" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="444" y="265">Версионируемый журнал опыта</tspan></text>

  <!-- Новая версия возвращается к стабильному агенту по внешнему контуру справа, не пересекая канал траекторий. -->
  <path d="M907 425 H986 V60 H295 V133" class="line" stroke-dasharray="7 5"/>
  <rect x="490" y="45" width="320" height="30" rx="4" fill="#ffffff"/>
  <text x="650" y="60" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="650" y="60">Новая версия, прошедшая проверку</tspan></text>

  <text x="500" y="588" text-anchor="middle" class="t s" dominant-baseline="central"><tspan x="500" y="588">Корень доверия: обычная эволюция не меняет права, аудит, проверку и откат</tspan></text>
</svg>
